<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palette">
<title>Palette</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#FAFAF8;
  --dark:#1A1410;
  --muted:#AAAAAA;
  --border:#E0DDD8;
  --accent:#B85C38;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--dark);font-family:'DM Sans',sans-serif;overflow:hidden;}
.app{height:100%;max-width:430px;margin:0 auto;position:relative;}
.screen{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 0.3s;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(80px + var(--safe-bottom));}
.screen.active{opacity:1;pointer-events:all;}
.safe-top{height:env(safe-area-inset-top,20px);}

/* ISSUE BAR */
.issue-bar{background:var(--accent);padding:6px 22px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.issue-text{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:rgba(250,250,248,0.7);}
.issue-date{font-size:8px;letter-spacing:2px;color:rgba(250,250,248,0.7);}

/* MAGAZINE HEADER */
.mag-header{padding:14px 22px 0;border-bottom:3px solid var(--dark);}
.mag-title{font-family:'Bebas Neue',sans-serif;font-size:64px;color:var(--dark);line-height:0.9;letter-spacing:2px;}
.mag-sub{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin:4px 0 12px;}

/* LOOK SECTION */
.look-section{padding:18px 22px 0;}
.look-eyebrow{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.look-name{font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--dark);line-height:0.95;letter-spacing:1px;margin-bottom:6px;}
.accent-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.accent-swatch{display:inline-flex;align-items:center;gap:9px;margin-bottom:16px;}
.accent-dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,0.1);flex-shrink:0;}
.accent-name{font-size:12px;font-weight:500;color:var(--dark);}

/* PIECES GRID */
.pieces-row{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--dark);border-bottom:1px solid var(--dark);margin:0 -22px;padding:0 22px;}
.piece-col{padding:12px 6px;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;}
.piece-col:last-child{border-right:none;}
.piece-swatch{width:42px;height:42px;border-radius:50%;border:1px solid rgba(0,0,0,0.08);position:relative;overflow:hidden;flex-shrink:0;}
.piece-swatch::after{content:'';position:absolute;top:14%;left:14%;width:28%;height:28%;background:rgba(255,255,255,0.2);border-radius:50%;}
.piece-label{font-size:7px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-align:center;}
.piece-name{font-family:'Playfair Display',serif;font-size:9px;font-style:italic;color:var(--dark);text-align:center;line-height:1.2;}

/* BUTTONS */
.next-btn{margin:14px 22px 0;background:var(--dark);border:none;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:opacity 0.15s;width:calc(100% - 44px);}
.next-btn:active{opacity:0.85;}
.next-btn-text{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--bg);letter-spacing:2px;}
.next-btn-icon{font-size:18px;color:var(--accent);}

.save-row{margin:10px 22px 0;display:flex;align-items:center;justify-content:space-between;}
.save-btn{background:transparent;border:1px solid var(--dark);padding:10px 18px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dark);cursor:pointer;display:flex;align-items:center;gap:7px;transition:all 0.15s;}
.save-btn.saved{background:var(--dark);color:var(--bg);}
.issue-counter{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}

/* LOOKBOOK */
.lookbook-section{padding:16px 22px 0;border-top:1px solid var(--dark);margin-top:16px;}
.lookbook-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:var(--dark);margin-bottom:12px;}
.lookbook-list{display:flex;flex-direction:column;}
.lookbook-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity 0.15s;}
.lookbook-row:active{opacity:0.7;}
.lookbook-row:last-child{border-bottom:none;}
.look-no{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--border);width:28px;text-align:center;flex-shrink:0;}
.look-dots{display:flex;gap:4px;flex-shrink:0;}
.l-dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,0.07);position:relative;overflow:hidden;flex-shrink:0;}
.l-dot::after{content:'';position:absolute;top:16%;left:16%;width:28%;height:28%;background:rgba(255,255,255,0.3);border-radius:50%;}
.look-info{flex:1;}
.look-item-name{font-family:'Playfair Display',serif;font-size:14px;font-style:italic;color:var(--dark);line-height:1.2;}
.look-item-date{font-size:9px;letter-spacing:1px;color:var(--muted);margin-top:1px;}
.look-accent-dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,0.08);flex-shrink:0;}

/* EMPTY */
.empty-state{text-align:center;padding:50px 30px;}
.empty-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--dark);margin-bottom:8px;}
.empty-sub{font-size:12px;letter-spacing:1px;color:var(--muted);}

/* SEARCH */
.search-section{padding:16px 22px 0;}
.search-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);padding:10px 0;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--dark);outline:none;direction:rtl;letter-spacing:0.5px;}
.search-input::placeholder{color:var(--muted);font-style:italic;}
.search-input:focus{border-bottom-color:var(--dark);}
.filter-chips{display:flex;gap:8px;padding:12px 22px 0;overflow-x:auto;}
.filter-chips::-webkit-scrollbar{display:none;}
.chip{background:transparent;border:1px solid var(--border);padding:5px 12px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);white-space:nowrap;cursor:pointer;transition:all 0.15s;flex-shrink:0;}
.chip.active{background:var(--dark);color:var(--bg);border-color:var(--dark);}
.search-results{padding:14px 22px 0;display:flex;flex-direction:column;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(26,20,16,0.45);z-index:150;opacity:0;pointer-events:none;transition:opacity 0.3s;backdrop-filter:blur(4px);}
.modal-overlay.show{opacity:1;pointer-events:all;}
.modal{position:absolute;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;background:var(--bg);padding:22px 22px calc(30px + var(--safe-bottom));transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.34,1.2,0.64,1);}
.modal-overlay.show .modal{transform:translateY(0);}
.modal-handle{width:32px;height:2px;background:var(--border);margin:0 auto 20px;}
.modal-issue{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}
.modal-name{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1px;color:var(--dark);margin-bottom:4px;}
.modal-date{font-size:10px;letter-spacing:1px;color:var(--muted);margin-bottom:18px;}
.modal-pieces{display:flex;gap:14px;margin-bottom:20px;}
.modal-piece{display:flex;flex-direction:column;align-items:center;gap:7px;}
.modal-swatch{width:48px;height:48px;border-radius:50%;border:1px solid rgba(0,0,0,0.08);position:relative;overflow:hidden;}
.modal-swatch::after{content:'';position:absolute;top:14%;left:14%;width:28%;height:28%;background:rgba(255,255,255,0.2);border-radius:50%;}
.modal-piece-label{font-size:7px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.modal-piece-name{font-family:'Playfair Display',serif;font-size:10px;font-style:italic;color:var(--dark);text-align:center;max-width:60px;line-height:1.2;}
.modal-delete{width:100%;background:none;border:1px solid rgba(160,80,60,0.25);padding:13px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#A0503C;cursor:pointer;}

/* NAV */
.nav-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(250,250,248,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--dark);padding:10px 40px calc(10px + var(--safe-bottom));display:flex;justify-content:space-around;z-index:100;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);cursor:pointer;border:none;background:none;padding:4px 12px;transition:color 0.2s;}
.nav-item.active{color:var(--dark);}
.nav-line{width:16px;height:2px;background:var(--accent);}
.nav-line-empty{width:16px;height:1px;background:var(--border);}

/* TOAST */
.toast{position:fixed;top:calc(env(safe-area-inset-top,20px) + 16px);left:50%;transform:translateX(-50%) translateY(-80px);background:var(--dark);color:var(--bg);padding:10px 20px;font-size:11px;letter-spacing:2px;text-transform:uppercase;z-index:200;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
@keyframes spin{to{transform:rotate(360deg);}}
.spinning{animation:spin 0.4s ease;}
</style>
</head>
<body>
<div class="app">
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-issue" id="modalIssue"></div>
    <div class="modal-name" id="modalName"></div>
    <div class="modal-date" id="modalDate"></div>
    <div class="modal-pieces" id="modalPieces"></div>
    <button class="modal-delete" id="modalDelete">Delete — מחקי לוק זה</button>
  </div>
</div>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="safe-top"></div>
  <div class="issue-bar">
    <span class="issue-text" id="issueNo">Issue No. 001</span>
    <span class="issue-date" id="issueDate"></span>
  </div>
  <div class="mag-header">
    <div class="mag-title">PALETTE</div>
    <div class="mag-sub">The Daily Look Edition</div>
  </div>
  <div class="look-section">
    <div class="look-eyebrow">Look of the day</div>
    <div class="look-name" id="todayName">—</div>
    <div class="accent-label">Accent color — זריקת הצבע</div>
    <div class="accent-swatch">
      <div class="accent-dot" id="accentDot"></div>
      <div class="accent-name" id="accentName"></div>
    </div>
    <div class="pieces-row" id="todayPieces"></div>
  </div>

  <button class="next-btn" onclick="shuffle()">
    <span class="next-btn-text">NEXT LOOK →</span>
    <span class="next-btn-icon" id="shuffleIcon">↻</span>
  </button>

  <div class="save-row">
    <button class="save-btn" id="saveBtn" onclick="saveCurrent()">שמרי ✓</button>
    <div class="issue-counter" id="lookCounter">Look 1 of ∞</div>
  </div>

  <div class="lookbook-section">
    <div class="lookbook-title">LOOKBOOK</div>
    <div class="lookbook-list" id="homeList"></div>
  </div>
</div>

<!-- LOOKBOOK FULL -->
<div class="screen" id="screen-lookbook">
  <div class="safe-top"></div>
  <div class="issue-bar">
    <span class="issue-text">Full Lookbook</span>
    <span class="issue-date" id="lookbookCount"></span>
  </div>
  <div class="mag-header">
    <div class="mag-title">LOOKBOOK</div>
    <div class="mag-sub" id="lookbookSubtitle">All looks</div>
  </div>
  <div style="padding:16px 22px 0;">
    <div class="lookbook-list" id="allList"></div>
  </div>
</div>

<!-- SEARCH -->
<div class="screen" id="screen-search">
  <div class="safe-top"></div>
  <div class="issue-bar">
    <span class="issue-text">Search</span>
    <span class="issue-date">Recherche</span>
  </div>
  <div class="mag-header">
    <div class="mag-title">חיפוש</div>
    <div class="mag-sub">By name, color, piece</div>
  </div>
  <div class="search-section">
    <input class="search-input" id="searchInput" placeholder="Search looks..." oninput="doSearch()">
  </div>
  <div class="filter-chips" id="filterChips"></div>
  <div class="search-results" id="searchResults"></div>
</div>

<div class="nav-bar">
  <button class="nav-item active" id="nav-home" onclick="goScreen('home')">
    <div class="nav-line"></div>היום
  </button>
  <button class="nav-item" id="nav-lookbook" onclick="goScreen('lookbook')">
    <div class="nav-line-empty"></div>לוקבוק
  </button>
  <button class="nav-item" id="nav-search" onclick="goScreen('search')">
    <div class="nav-line-empty"></div>חיפוש
  </button>
</div>
</div>

<script>
var PIECES=['עליון','תחתון','נעליים','אביזר'];

var ALL_COLORS=[
  {name:'Ivory Mist',hex:'#F5EFE0',family:'neutral',warmth:0},
  {name:'Pale Linen',hex:'#EDE5D4',family:'neutral',warmth:0},
  {name:'Warm Chalk',hex:'#E8E0D2',family:'neutral',warmth:0},
  {name:'Sand Drift',hex:'#D4C4A8',family:'neutral',warmth:0},
  {name:'Aged Cream',hex:'#C8B898',family:'neutral',warmth:0},
  {name:'Parchment',hex:'#C0A882',family:'neutral',warmth:0},
  {name:'Silver Fog',hex:'#B0ACAA',family:'neutral',warmth:0},
  {name:'White Stone',hex:'#E8E4E0',family:'neutral',warmth:0},
  {name:'Camel',hex:'#B89060',family:'neutral',warmth:1},
  {name:'Cognac',hex:'#8B5E3C',family:'neutral',warmth:1},
  {name:'Bark',hex:'#6B4226',family:'neutral',warmth:1},
  {name:'Dark Earth',hex:'#3E2614',family:'neutral',warmth:1},
  {name:'Ash',hex:'#7A7470',family:'neutral',warmth:0},
  {name:'Slate',hex:'#4A4642',family:'neutral',warmth:0},
  {name:'Charcoal',hex:'#2E2A26',family:'neutral',warmth:0},
  {name:'Noir',hex:'#1A1614',family:'neutral',warmth:0},
  {name:'Venetian Red',hex:'#A83828',family:'warm'},
  {name:'Cherry',hex:'#8B1A2E',family:'warm'},
  {name:'Crimson',hex:'#C41E3A',family:'warm'},
  {name:'Rust',hex:'#B85C38',family:'warm'},
  {name:'Persimmon',hex:'#D4572A',family:'warm'},
  {name:'Terracotta',hex:'#C4714A',family:'warm'},
  {name:'Peach Bloom',hex:'#E8B49A',family:'warm'},
  {name:'Dusty Rose',hex:'#C49090',family:'warm'},
  {name:'Faded Blush',hex:'#E8C4BC',family:'warm'},
  {name:'Antique Rose',hex:'#B87878',family:'warm'},
  {name:'Coral',hex:'#D4604A',family:'warm'},
  {name:'Smoked Plum',hex:'#6B3A5A',family:'purple'},
  {name:'Deep Bordeaux',hex:'#5C1A2E',family:'purple'},
  {name:'Mulberry',hex:'#8B4B6B',family:'purple'},
  {name:'Fig',hex:'#4A2040',family:'purple'},
  {name:'Lavender',hex:'#B4A0C8',family:'purple'},
  {name:'Mauve',hex:'#9A7090',family:'purple'},
  {name:'Wisteria',hex:'#C4A0C8',family:'purple'},
  {name:'Indigo',hex:'#2E3A6B',family:'blue'},
  {name:'Midnight Blue',hex:'#1C2B3A',family:'blue'},
  {name:'Cobalt',hex:'#2A4A8A',family:'blue'},
  {name:'Slate Blue',hex:'#5A6B8A',family:'blue'},
  {name:'Dove Blue',hex:'#8A9AB0',family:'blue'},
  {name:'Forest',hex:'#2C3E2D',family:'green'},
  {name:'Sage',hex:'#7A9A7E',family:'green'},
  {name:'Moss',hex:'#5C6B4A',family:'green'},
  {name:'Olive',hex:'#6B6A38',family:'green'},
  {name:'Hunter',hex:'#2A4A2E',family:'green'},
  {name:'Amber',hex:'#C8A030',family:'gold'},
  {name:'Honey Gold',hex:'#D4A853',family:'gold'},
  {name:'Warm Yellow',hex:'#E8C84A',family:'gold'},
  {name:'Mustard',hex:'#B89428',family:'gold'},
  {name:'Champagne',hex:'#D4C090',family:'gold'},
];

var HARMONY_RULES = [
  // אנלוגיים — צבעים שכנים
  {type:'analogous', families:['warm','purple'], neutrals:0},
  {type:'analogous', families:['warm','purple'], neutrals:1},
  {type:'analogous', families:['blue','purple'], neutrals:0},
  {type:'analogous', families:['blue','purple'], neutrals:1},
  {type:'analogous', families:['blue','green'], neutrals:0},
  {type:'analogous', families:['blue','green'], neutrals:1},
  {type:'analogous', families:['green','gold'], neutrals:0},
  {type:'analogous', families:['green','gold'], neutrals:1},
  {type:'analogous', families:['warm','gold'], neutrals:0},
  {type:'analogous', families:['warm','gold'], neutrals:1},
  // קומפלמנטריים — ניגודים
  {type:'complementary', families:['warm','blue'], neutrals:0},
  {type:'complementary', families:['warm','blue'], neutrals:1},
  {type:'complementary', families:['warm','green'], neutrals:0},
  {type:'complementary', families:['warm','green'], neutrals:1},
  {type:'complementary', families:['purple','gold'], neutrals:0},
  {type:'complementary', families:['purple','gold'], neutrals:1},
  {type:'complementary', families:['purple','green'], neutrals:0},
  // טריאדה — שלושה צבעים
  {type:'triad', families:['warm','blue','gold'], neutrals:0},
  {type:'triad', families:['warm','blue','gold'], neutrals:1},
  {type:'triad', families:['purple','green','warm'], neutrals:0},
  {type:'triad', families:['purple','green','warm'], neutrals:1},
  {type:'triad', families:['blue','gold','warm'], neutrals:0},
  {type:'triad', families:['purple','gold','green'], neutrals:0},
  {type:'triad', families:['warm','green','blue'], neutrals:1},
  // אקצנט חד — ניטרלים עם זריקה
  {type:'accent', families:['warm'], neutrals:3},
  {type:'accent', families:['purple'], neutrals:3},
  {type:'accent', families:['blue'], neutrals:3},
  {type:'accent', families:['green'], neutrals:3},
  {type:'accent', families:['gold'], neutrals:3},
  {type:'accent', families:['warm'], neutrals:2},
  {type:'accent', families:['purple'], neutrals:2},
  {type:'accent', families:['blue'], neutrals:2},
  // ארבעה צבעים — Sanzo סטייל
  {type:'full', families:['warm','blue','green','gold'], neutrals:0},
  {type:'full', families:['warm','purple','blue','gold'], neutrals:0},
  {type:'full', families:['purple','green','warm','blue'], neutrals:0},
];

function pickRandom(arr){return arr[Math.floor(Math.random()*arr.length)];}
function getByFamily(fam){return ALL_COLORS.filter(function(c){return c.family===fam;});}
function getNeutrals(){return ALL_COLORS.filter(function(c){return c.family==='neutral';});}

function generateLook(recentNames){
  recentNames=recentNames||[];
  for(var attempts=0;attempts<80;attempts++){
    var rule=pickRandom(HARMONY_RULES);
    var colorSlots=4-rule.neutrals;
    var pickedColors=[];
    var ok=true;

    if(rule.type==='accent'){
      var c=pickRandom(getByFamily(rule.families[0]));
      if(!c){ok=false;}else{pickedColors=[c];}
    } else if(rule.type==='analogous'||rule.type==='complementary'){
      var c1=pickRandom(getByFamily(rule.families[0]));
      var c2=pickRandom(getByFamily(rule.families[1]));
      if(!c1||!c2){ok=false;}else{pickedColors=[c1,c2];}
    } else if(rule.type==='triad'){
      var c1=pickRandom(getByFamily(rule.families[0]));
      var c2=pickRandom(getByFamily(rule.families[1]));
      var c3=pickRandom(getByFamily(rule.families[2]));
      if(!c1||!c2||!c3){ok=false;}else{pickedColors=[c1,c2,c3];}
    } else if(rule.type==='full'){
      for(var fi=0;fi<rule.families.length;fi++){
        var c=pickRandom(getByFamily(rule.families[fi]));
        if(!c){ok=false;break;}
        pickedColors.push(c);
      }
    }

    if(!ok)continue;

    var neutralPool=getNeutrals();
    var pieces=pickedColors.map(function(c){return c.name;});
    for(var ni=0;ni<rule.neutrals;ni++){
      var n=pickRandom(neutralPool);
      pieces.push(n.name);
    }

    // shuffle pieces
    for(var si=pieces.length-1;si>0;si--){
      var sj=Math.floor(Math.random()*(si+1));
      var st=pieces[si];pieces[si]=pieces[sj];pieces[sj]=st;
    }

    // accent = most saturated color
    var accent=pickedColors[0];
    var maxSat=0;
    for(var pi=0;pi<pickedColors.length;pi++){
      var c=pickedColors[pi];
      var r=parseInt(c.hex.slice(1,3),16);
      var g=parseInt(c.hex.slice(3,5),16);
      var b=parseInt(c.hex.slice(5,7),16);
      var sat=Math.max(r,g,b)-Math.min(r,g,b);
      if(sat>maxSat){maxSat=sat;accent=c;}
    }

    var name=pickedColors.map(function(c){return c.name;}).join(' & ');
    if(recentNames.indexOf(name)!==-1)continue;
    return{name:name,accent:accent,pieces:pieces};
  }
  return{name:'Rust & Indigo',accent:{name:'Rust',hex:'#B85C38'},pieces:['Rust','Indigo','Ivory Mist','Camel']};
}

function getColor(name){
  for(var i=0;i<ALL_COLORS.length;i++)if(ALL_COLORS[i].name===name)return ALL_COLORS[i];
  return{name:name,hex:'#888'};
}

var state={today:null,todaySaved:false,history:[],searchFilter:null,issueCount:0};
function loadState(){
  try{var s=localStorage.getItem('palette-editorial');if(s){var p=JSON.parse(s);state.today=p.today||null;state.history=p.history||[];state.issueCount=p.issueCount||0;}}catch(e){}
  if(!state.today){state.today=generateLook([]);state.issueCount=1;}
}
function saveState(){try{localStorage.setItem('palette-editorial',JSON.stringify({today:state.today,history:state.history,issueCount:state.issueCount}));}catch(e){}}

function formatDate(d){return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear().toString().slice(2);}
function formatDateShort(str){if(!str)return'';var p=str.split('.');if(p.length<2)return str;return p[0]+'.'+String(parseInt(p[1])).padStart(2,'0');}

function shuffle(){
  var recent=state.history.slice(0,8).map(function(h){return h.name;});
  state.today=generateLook(recent);
  state.todaySaved=false;
  state.issueCount++;
  saveState();renderHome();
  var icon=document.getElementById('shuffleIcon');
  icon.classList.remove('spinning');void icon.offsetWidth;icon.classList.add('spinning');
  setTimeout(function(){icon.classList.remove('spinning');},400);
  document.getElementById('saveBtn').classList.remove('saved');
}

function saveCurrent(){
  if(!state.today)return;
  if(state.todaySaved){showToast('Already saved');return;}
  state.history.unshift({name:state.today.name,accent:state.today.accent,pieces:state.today.pieces,date:formatDate(new Date()),no:state.issueCount});
  if(state.history.length>100)state.history=state.history.slice(0,100);
  state.todaySaved=true;
  saveState();renderHome();renderLookbook();doSearch();
  document.getElementById('saveBtn').classList.add('saved');
  showToast('Saved ✓');
}

function renderHome(){
  if(!state.today)return;
  var t=state.today;
  var no=String(state.issueCount).padStart(3,'0');
  var today=new Date();
  document.getElementById('issueNo').textContent='Issue No. '+no;
  document.getElementById('issueDate').textContent=formatDateShort(formatDate(today));
  document.getElementById('lookCounter').textContent='Look '+state.issueCount+' of \u221e';
  document.getElementById('todayName').textContent=t.name;
  document.getElementById('accentDot').style.background=t.accent.hex;
  document.getElementById('accentName').textContent=t.accent.name;

  var pHTML='';
  for(var i=0;i<4;i++){
    var c=getColor(t.pieces[i]||'Ivory Mist');
    pHTML+='<div class="piece-col">'
      +'<div class="piece-swatch" style="background:'+c.hex+';"></div>'
      +'<div class="piece-label">'+PIECES[i]+'</div>'
      +'<div class="piece-name">'+c.name+'</div>'
      +'</div>';
  }
  document.getElementById('todayPieces').innerHTML=pHTML;

  var list=document.getElementById('homeList');
  if(!state.history.length){
    list.innerHTML='<div class="empty-state"><div class="empty-title">Lookbook Empty</div><div class="empty-sub">Save your first look</div></div>';
    return;
  }
  var html='';
  for(var i=0;i<Math.min(4,state.history.length);i++)html+=lookRowHTML(state.history[i],i);
  list.innerHTML=html;
}

function lookRowHTML(h,idx){
  var dots='';
  var shown=Math.min(3,h.pieces.length);
  for(var j=0;j<shown;j++){var c=getColor(h.pieces[j]);dots+='<div class="l-dot" style="background:'+c.hex+';"></div>';}
  return'<div class="lookbook-row" onclick="openModal('+idx+')">'
    +'<div class="look-no">'+String(h.no||idx+1).padStart(2,'0')+'</div>'
    +'<div class="look-dots">'+dots+'</div>'
    +'<div class="look-info"><div class="look-item-name">'+h.name+'</div><div class="look-item-date">'+formatDateShort(h.date)+'</div></div>'
    +'<div class="look-accent-dot" style="background:'+h.accent.hex+';border:1px solid rgba(0,0,0,0.08);"></div>'
    +'</div>';
}

function renderLookbook(){
  var list=document.getElementById('allList');
  var count=state.history.length;
  document.getElementById('lookbookCount').textContent=count+' looks';
  document.getElementById('lookbookSubtitle').textContent=count?' '+count+' looks saved':'No looks yet';
  if(!count){
    list.innerHTML='<div class="empty-state"><div class="empty-title">No Looks Yet</div><div class="empty-sub">Start saving looks</div></div>';
    return;
  }
  var html='';for(var i=0;i<count;i++)html+=lookRowHTML(state.history[i],i);
  list.innerHTML=html;
}

function openModal(index){
  var h=state.history[index];if(!h)return;
  document.getElementById('modalIssue').textContent='Issue No. '+String(h.no||index+1).padStart(3,'0');
  document.getElementById('modalName').textContent=h.name;
  document.getElementById('modalDate').textContent=formatDateShort(h.date);
  var html='';
  for(var i=0;i<4;i++){
    var c=getColor(h.pieces[i]||'Ivory Mist');
    html+='<div class="modal-piece">'
      +'<div class="modal-swatch" style="background:'+c.hex+';"></div>'
      +'<div class="modal-piece-label">'+PIECES[i]+'</div>'
      +'<div class="modal-piece-name">'+c.name+'</div>'
      +'</div>';
  }
  document.getElementById('modalPieces').innerHTML=html;
  document.getElementById('modalDelete').onclick=function(){deleteLook(index);};
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(e){if(e&&e.target!==document.getElementById('modalOverlay'))return;document.getElementById('modalOverlay').classList.remove('show');}
function deleteLook(index){state.history.splice(index,1);saveState();renderHome();renderLookbook();doSearch();document.getElementById('modalOverlay').classList.remove('show');showToast('Deleted');}

var activeFilter=null;
var FILTER_OPTIONS=['נייטרל','צבע','כהה','בהיר'];
function buildFilterChips(){
  var html='';
  for(var i=0;i<FILTER_OPTIONS.length;i++){
    var f=FILTER_OPTIONS[i];
    html+='<div class="chip'+(activeFilter===f?' active':'')+'" onclick="setFilter(\''+f+'\')">'+f+'</div>';
  }
  document.getElementById('filterChips').innerHTML=html;
}
function setFilter(f){activeFilter=activeFilter===f?null:f;buildFilterChips();doSearch();}
function lookMatchesFilter(h,f){
  var neutralNames=ALL_COLORS.filter(function(c){return c.family==='neutral';}).map(function(n){return n.name;});
  if(f==='נייטרל')return h.pieces.every(function(p){return neutralNames.indexOf(p)!==-1;});
  if(f==='צבע')return h.pieces.some(function(p){return neutralNames.indexOf(p)===-1;});
  function lum(p){var c=getColor(p);var r=parseInt(c.hex.slice(1,3),16),g=parseInt(c.hex.slice(3,5),16),b=parseInt(c.hex.slice(5,7),16);return(r+g+b)/3;}
  if(f==='כהה')return h.pieces.filter(function(p){return lum(p)<80;}).length>=2;
  if(f==='בהיר')return h.pieces.filter(function(p){return lum(p)>180;}).length>=2;
  return true;
}
function doSearch(){
  var q=document.getElementById('searchInput').value.trim().toLowerCase();
  var results=state.history.slice();
  if(activeFilter)results=results.filter(function(h){return lookMatchesFilter(h,activeFilter);});
  if(q)results=results.filter(function(h){
    return h.name.toLowerCase().indexOf(q)!==-1
      ||h.accent.name.toLowerCase().indexOf(q)!==-1
      ||h.pieces.some(function(p){return p.toLowerCase().indexOf(q)!==-1;});
  });
  var el=document.getElementById('searchResults');
  if(!q&&!activeFilter){el.innerHTML='<div class="empty-state"><div class="empty-title">Search</div><div class="empty-sub">by name, color or piece</div></div>';return;}
  if(!results.length){el.innerHTML='<div class="empty-state"><div class="empty-title">No Results</div></div>';return;}
  var html='';for(var i=0;i<results.length;i++)html+=lookRowHTML(results[i],i);
  el.innerHTML=html;
}

function goScreen(name){
  var screens=document.querySelectorAll('.screen');for(var i=0;i<screens.length;i++)screens[i].classList.remove('active');
  var navs=document.querySelectorAll('.nav-item');for(var i=0;i<navs.length;i++){navs[i].classList.remove('active');navs[i].querySelector('div').className='nav-line-empty';}
  document.getElementById('screen-'+name).classList.add('active');
  var btn=document.getElementById('nav-'+name);btn.classList.add('active');btn.querySelector('div').className='nav-line';
  if(name==='search'){buildFilterChips();doSearch();setTimeout(function(){document.getElementById('searchInput').focus();},300);}
}

var toastTimer;
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2000);}

loadState();renderHome();renderLookbook();
</script>
<script>
if('serviceWorker'in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/palette/service-worker.js');});}
</script>
</body>

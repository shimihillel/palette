<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7b2d26" />
  <title>מה ללבוש היום?</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero-card">
      <p class="eyebrow">שימי סטייל</p>
      <h1>מה ללבוש היום?</h1>
      <p class="subtitle">פלטות צבעים עם טעם, קצת וינטג׳, והרבה פחות אדום שתלטן.</p>
    </section>

    <section class="mode-card" aria-label="בחירת מצב">
      <button class="mode-btn active" data-mode="random">אקראי</button>
      <button class="mode-btn" data-mode="hasColor">יש לי צבע</button>
    </section>

    <section class="input-card hidden" id="colorInputCard">
      <label for="baseColor">איזה צבע כבר יש לך?</label>
      <select id="baseColor">
        <option value="brown">חום</option>
        <option value="olive">זית</option>
        <option value="burgundy">בורדו</option>
        <option value="blue">כחול</option>
        <option value="green">ירוק</option>
        <option value="pink">ורוד</option>
        <option value="black">שחור</option>
        <option value="white">לבן</option>
        <option value="beige">בז׳</option>
        <option value="red">אדום</option>
      </select>
    </section>

    <section class="look-card" id="lookCard">
      <div class="look-header">
        <p class="look-label">הלוק שלך</p>
        <button class="tiny-btn" id="resetHistoryBtn" title="איפוס היסטוריית צבעים">איפוס</button>
      </div>

      <div class="palette" id="palette"></div>

      <div class="items-grid">
        <article class="item-note">
          <span>בגד מרכזי</span>
          <strong id="mainItem">—</strong>
        </article>
        <article class="item-note">
          <span>נעליים</span>
          <strong id="shoesItem">—</strong>
        </article>
        <article class="item-note">
          <span>אביזר</span>
          <strong id="accessoryItem">—</strong>
        </article>
      </div>

      <p class="reason" id="reason">לחצי על הבא בתור כדי לקבל שילוב.</p>
    </section>

    <section class="actions">
      <button class="primary" id="nextBtn">הבא בתור</button>
      <button class="secondary" id="saveBtn">שומרת ♡</button>
      <button class="secondary" id="chosenBtn">בחרתי משהו</button>
    </section>

    <section class="saved-card">
      <h2>שמורים</h2>
      <div id="savedLooks" class="saved-list empty">עוד אין שמורים. מחכים ללוק שצועק שימי.</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palette">
<title>Palette</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700;1,900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --cream: #F5EDD8;
  --dark: #1C1208;
  --pink: #E8527A;
  --olive: #4E6020;
  --orange: #E87040;
  --lavender: #9B7EC8;
  --teal: #2A8C7A;
  --yellow: #F0C430;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  height: 100%;
  background: var(--cream);
  color: var(--dark);
  font-family: 'Space Grotesk', sans-serif;
  overflow: hidden;
}

.app {
  height: 100%;
  max-width: 430px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
}

/* ══ SCREENS ══ */
.screen {
  position: absolute; inset: 0;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
  overflow-y: auto; overflow-x: hidden;
  padding-bottom: calc(80px + var(--safe-bottom));
}
.screen.active { opacity: 1; pointer-events: all; }
.safe-top { height: env(safe-area-inset-top, 20px); flex-shrink: 0; }

/* ══ WAVY BACKGROUND ══ */
.wavy-bg {
  position: fixed; top: 0; left: 0; right: 0; height: 280px;
  z-index: 0; pointer-events: none; max-width: 430px; margin: 0 auto;
}

/* ══ HEADER ══ */
.header {
  padding: 16px 20px 0;
  position: relative; z-index: 2;
  display: flex; align-items: flex-start; justify-content: space-between;
}

.app-title {
  font-family: 'Fraunces', serif;
  font-size: 52px; font-weight: 900; font-style: italic;
  color: var(--cream); line-height: 1;
  text-shadow: 3px 3px 0 var(--dark);
}

.title-badge {
  background: var(--yellow);
  color: var(--dark);
  font-size: 10px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase;
  padding: 4px 10px; border-radius: 20px;
  border: 2px solid var(--dark);
  margin-top: 8px;
  display: inline-block;
  transform: rotate(-2deg);
}

/* ══ TODAY HERO ══ */
.today-hero {
  margin: 14px 16px 0;
  position: relative; z-index: 2;
}

.hero-card {
  background: var(--cream);
  border-radius: 28px;
  border: 3px solid var(--dark);
  overflow: hidden;
  box-shadow: 6px 6px 0 var(--dark);
}

.hero-top {
  background: var(--olive);
  padding: 18px 20px 14px;
  position: relative;
  overflow: hidden;
}

/* zigzag bottom of hero-top */
.hero-top::after {
  content: '';
  position: absolute; bottom: -10px; left: 0; right: 0; height: 20px;
  background: var(--cream);
  clip-path: polygon(0% 100%, 4% 0%, 8% 100%, 12% 0%, 16% 100%, 20% 0%, 24% 100%, 28% 0%, 32% 100%, 36% 0%, 40% 100%, 44% 0%, 48% 100%, 52% 0%, 56% 100%, 60% 0%, 64% 100%, 68% 0%, 72% 100%, 76% 0%, 80% 100%, 84% 0%, 88% 100%, 92% 0%, 96% 100%, 100% 0%, 100% 100%);
}

.hero-eyebrow {
  font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
  color: rgba(245,237,216,0.6); margin-bottom: 6px; font-weight: 700;
}

.hero-name {
  font-family: 'Fraunces', serif;
  font-size: 30px; font-weight: 700; font-style: italic;
  color: var(--cream); line-height: 1.1; margin-bottom: 10px;
}

.accent-pill {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--pink);
  border: 2px solid var(--dark);
  border-radius: 20px; padding: 5px 12px 5px 8px;
  font-size: 11px; font-weight: 700; color: white;
  box-shadow: 2px 2px 0 var(--dark);
}

.accent-circle {
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid white; flex-shrink: 0;
}

/* ══ CIRCLES ROW ══ */
.circles-row {
  display: flex; gap: 0; padding: 20px 16px 16px;
}

.circle-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
}

.big-circle {
  width: 62px; height: 62px; border-radius: 50%;
  border: 3px solid var(--dark);
  box-shadow: 3px 3px 0 var(--dark);
  position: relative; overflow: hidden; flex-shrink: 0;
}
.big-circle::after {
  content: ''; position: absolute; top: 12%; left: 12%;
  width: 28%; height: 28%; background: rgba(255,255,255,0.3);
  border-radius: 50%;
}

.circle-label {
  font-size: 8px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--dark); opacity: 0.5;
}

.circle-name {
  font-family: 'Fraunces', serif; font-size: 11px; font-style: italic;
  color: var(--dark); text-align: center; line-height: 1.2; max-width: 68px;
}

/* divider between circles */
.circle-divider {
  width: 1px; background: rgba(28,18,8,0.1); align-self: stretch;
  margin: 8px 0;
}

/* ══ BUTTONS ══ */
.btns-row {
  display: flex; gap: 10px; margin: 0 16px 0; padding-bottom: 4px;
  position: relative; z-index: 2;
}

.shuffle-btn {
  flex: 1;
  background: var(--pink);
  border: 3px solid var(--dark);
  border-radius: 20px; padding: 16px 18px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; transition: transform 0.1s;
  box-shadow: 4px 4px 0 var(--dark);
  position: relative; overflow: hidden;
}
.shuffle-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(-55deg, transparent, transparent 6px, rgba(255,255,255,0.06) 6px, rgba(255,255,255,0.06) 12px);
}
.shuffle-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--dark); }

.shuffle-btn-text {
  font-family: 'Fraunces', serif; font-size: 18px; font-style: italic;
  font-weight: 700; color: white; position: relative; z-index: 1;
}

.shuffle-icon {
  width: 32px; height: 32px; background: rgba(255,255,255,0.25);
  border-radius: 10px; border: 2px solid rgba(255,255,255,0.4);
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 16px; position: relative; z-index: 1;
}

.save-btn {
  background: var(--yellow);
  border: 3px solid var(--dark);
  border-radius: 20px; padding: 16px 14px;
  display: flex; align-items: center; gap: 6px;
  cursor: pointer; transition: transform 0.1s;
  box-shadow: 4px 4px 0 var(--dark);
  flex-shrink: 0;
}
.save-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--dark); }
.save-btn.saved { background: var(--dark); }

.save-btn-text {
  font-family: 'Fraunces', serif; font-size: 16px;
  font-style: italic; font-weight: 700; color: var(--dark);
}
.save-btn.saved .save-btn-text { color: var(--cream); }
.save-check { font-size: 14px; color: var(--dark); }
.save-btn.saved .save-check { color: var(--yellow); }

/* ══ SECTION ══ */
.section-header {
  padding: 20px 20px 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.section-title {
  font-size: 11px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--dark); opacity: 0.4;
}
.section-count { font-size: 11px; color: var(--dark); opacity: 0.4; }

/* ══ HISTORY LIST ══ */
.history-list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }

.history-item {
  background: white;
  border-radius: 20px; padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  border: 2.5px solid var(--dark);
  cursor: pointer; transition: transform 0.1s;
  box-shadow: 3px 3px 0 var(--dark);
  position: relative; overflow: hidden;
}
.history-item:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--dark); }

/* colored left bar */
.history-item-bar {
  position: absolute; top: 0; right: 0; width: 6px; bottom: 0;
  border-radius: 0 18px 18px 0;
}

.history-palette { display: flex; gap: 5px; flex-shrink: 0; }

.h-dot {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2.5px solid var(--dark); flex-shrink: 0;
  position: relative; overflow: hidden;
}
.h-dot::after {
  content: ''; position: absolute; top: 12%; left: 12%;
  width: 30%; height: 30%; background: rgba(255,255,255,0.35);
  border-radius: 50%;
}

.history-info { flex: 1; }
.history-name {
  font-family: 'Fraunces', serif; font-size: 16px;
  font-style: italic; font-weight: 700; color: var(--dark); line-height: 1.2;
}
.history-date { font-size: 10px; color: var(--dark); opacity: 0.4; margin-top: 2px; }

.history-accent-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.h-accent-circle {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--dark); flex-shrink: 0;
}
.h-accent-label { font-size: 8px; font-weight: 700; color: var(--dark); opacity: 0.4; letter-spacing: 0.5px; }

/* ══ EMPTY ══ */
.empty-state { text-align: center; padding: 50px 40px; }
.empty-icon { font-size: 44px; margin-bottom: 16px; }
.empty-state p { font-family: 'Fraunces', serif; font-size: 18px; font-style: italic; color: var(--dark); opacity: 0.5; }

/* ══ SEARCH ══ */
.search-wrap { margin: 16px 16px 0; position: relative; }
.search-input {
  width: 100%; background: white;
  border: 2.5px solid var(--dark); border-radius: 16px;
  padding: 14px 16px 14px 44px;
  font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 500;
  color: var(--dark); outline: none; direction: rtl;
  box-shadow: 3px 3px 0 var(--dark);
}
.search-input::placeholder { color: rgba(28,18,8,0.3); }
.search-input:focus { border-color: var(--pink); }
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--dark); opacity: 0.3; font-size: 16px; pointer-events: none; }

.filter-chips { display: flex; gap: 8px; padding: 12px 16px 0; overflow-x: auto; flex-shrink: 0; }
.filter-chips::-webkit-scrollbar { display: none; }

.chip {
  background: white; border: 2px solid var(--dark);
  border-radius: 20px; padding: 7px 16px;
  font-size: 12px; font-weight: 700; color: var(--dark);
  white-space: nowrap; cursor: pointer; transition: all 0.1s;
  flex-shrink: 0; box-shadow: 2px 2px 0 var(--dark);
}
.chip:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--dark); }
.chip.active { background: var(--olive); color: var(--cream); border-color: var(--dark); }

.search-results { padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px; }

/* ══ MODAL ══ */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(28,18,8,0.5);
  z-index: 150; opacity: 0; pointer-events: none;
  transition: opacity 0.3s; backdrop-filter: blur(4px);
}
.modal-overlay.show { opacity: 1; pointer-events: all; }

.modal {
  position: absolute; bottom: 0; left: 0; right: 0;
  max-width: 430px; margin: 0 auto;
  background: var(--cream); border-radius: 28px 28px 0 0;
  border: 3px solid var(--dark); border-bottom: none;
  padding: 20px 24px calc(32px + var(--safe-bottom));
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.34,1.2,0.64,1);
}
.modal-overlay.show .modal { transform: translateY(0); }

.modal-handle { width: 40px; height: 4px; background: var(--dark); opacity: 0.2; border-radius: 2px; margin: 0 auto 20px; }

.modal-name {
  font-family: 'Fraunces', serif; font-size: 28px; font-style: italic;
  font-weight: 700; color: var(--dark); margin-bottom: 4px;
}
.modal-date { font-size: 11px; color: var(--dark); opacity: 0.4; margin-bottom: 20px; }

.modal-circles { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
.modal-circle-item { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.modal-circle {
  width: 58px; height: 58px; border-radius: 50%;
  border: 3px solid var(--dark); box-shadow: 3px 3px 0 var(--dark);
  position: relative; overflow: hidden;
}
.modal-circle::after { content: ''; position: absolute; top: 12%; left: 12%; width: 28%; height: 28%; background: rgba(255,255,255,0.25); border-radius: 50%; }
.modal-piece-label { font-size: 8px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--dark); opacity: 0.4; }
.modal-piece-name { font-family: 'Fraunces', serif; font-size: 12px; font-style: italic; font-weight: 700; color: var(--dark); text-align: center; max-width: 64px; line-height: 1.2; }

.modal-delete {
  width: 100%; background: none;
  border: 2px solid rgba(232,82,122,0.4); border-radius: 14px;
  padding: 14px; font-family: 'Space Grotesk', sans-serif;
  font-size: 13px; font-weight: 700; color: var(--pink);
  cursor: pointer; transition: background 0.15s;
}
.modal-delete:active { background: rgba(232,82,122,0.08); }

/* ══ NAV ══ */
.nav-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  background: var(--dark);
  padding: 10px 20px calc(10px + var(--safe-bottom));
  display: flex; justify-content: space-around; z-index: 100;
  border-top: 3px solid var(--dark);
}

.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  color: rgba(245,237,216,0.4); cursor: pointer; border: none; background: none;
  padding: 6px 16px; border-radius: 14px; transition: all 0.15s;
}
.nav-item.active {
  color: var(--dark);
  background: var(--yellow);
}

.nav-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--yellow); }
.nav-dot-empty { width: 5px; height: 5px; border-radius: 50%; background: rgba(245,237,216,0.2); }

/* ══ TOAST ══ */
.toast {
  position: fixed;
  top: calc(env(safe-area-inset-top, 20px) + 16px); left: 50%;
  transform: translateX(-50%) translateY(-80px);
  background: var(--dark); color: var(--yellow);
  padding: 10px 20px; border-radius: 20px;
  font-size: 13px; font-weight: 700; border: 2px solid var(--yellow);
  z-index: 200; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@keyframes spin { to { transform: rotate(360deg); } }
.spinning { animation: spin 0.4s ease; }
</style>
</head>
<body>
<div class="app">

<div class="toast" id="toast"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-name" id="modalName"></div>
    <div class="modal-date" id="modalDate"></div>
    <div class="modal-circles" id="modalGrid"></div>
    <button class="modal-delete" id="modalDelete">מחקי לוק זה 🗑</button>
  </div>
</div>

<!-- ══ HOME ══ -->
<div class="screen active" id="screen-home">
  <div class="safe-top"></div>

  <!-- wavy olive header bg -->
  <svg class="wavy-bg" viewBox="0 0 430 280" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,0 L430,0 L430,220 Q380,260 340,240 Q290,220 250,245 Q200,270 160,248 Q110,225 70,248 Q30,268 0,245 Z" fill="#4E6020"/>
    <!-- decorative wavy lines -->
    <path d="M20,200 Q60,185 100,200 Q140,215 180,200 Q220,185 260,200 Q300,215 340,200 Q380,185 420,200" stroke="rgba(245,237,216,0.15)" stroke-width="2" fill="none"/>
    <path d="M20,215 Q60,200 100,215 Q140,230 180,215 Q220,200 260,215 Q300,230 340,215 Q380,200 420,215" stroke="rgba(245,237,216,0.1)" stroke-width="1.5" fill="none"/>
    <!-- flowers -->
    <circle cx="30" cy="60" r="6" fill="rgba(232,82,122,0.4)"/>
    <circle cx="30" cy="60" r="3" fill="rgba(245,237,216,0.6)"/>
    <circle cx="400" cy="80" r="8" fill="rgba(240,196,48,0.35)"/>
    <circle cx="400" cy="80" r="4" fill="rgba(245,237,216,0.5)"/>
    <circle cx="200" cy="40" r="5" fill="rgba(155,126,200,0.4)"/>
  </svg>

  <div class="header" style="position:relative;z-index:2;">
    <div>
      <div class="app-title">Palette</div>
      <div class="title-badge">✿ לוק יומי</div>
    </div>
    <div style="font-size:32px;margin-top:8px;opacity:0.7;">🌸</div>
  </div>

  <!-- TODAY HERO -->
  <div class="today-hero">
    <div class="hero-card">
      <div class="hero-top">
        <div class="hero-eyebrow">הלוק של היום ✦</div>
        <div class="hero-name" id="todayName">—</div>
        <div id="todayAccentTag">
          <div class="accent-pill">
            <div class="accent-circle" id="todayAccentDot"></div>
            <span id="todayAccentText"></span>
          </div>
        </div>
      </div>
      <div class="circles-row" id="todayGrid"></div>
    </div>
  </div>

  <!-- BUTTONS -->
  <div class="btns-row" style="margin-top:14px;">
    <button class="shuffle-btn" onclick="shuffle()">
      <div class="shuffle-btn-text">לוק חדש!</div>
      <div class="shuffle-icon" id="shuffleIcon">↻</div>
    </button>
    <button class="save-btn" id="saveBtn" onclick="saveCurrent()">
      <div class="save-btn-text">שמרי</div>
      <div class="save-check">✓</div>
    </button>
  </div>

  <div class="section-header">
    <div class="section-title">לוקים שמורים</div>
    <div class="section-count" id="homeCount"></div>
  </div>
  <div class="history-list" id="homeList"></div>
</div>

<!-- ══ HISTORY ══ -->
<div class="screen" id="screen-history">
  <div class="safe-top"></div>
  <div style="padding:16px 20px 0;position:relative;z-index:2;">
    <div style="font-family:'Fraunces',serif;font-size:42px;font-weight:900;font-style:italic;color:var(--olive);">היסטוריה</div>
    <div style="font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--dark);opacity:0.4;margin-top:2px;" id="historySubtitle"></div>
  </div>
  <div class="section-header" style="padding-top:16px;">
    <div class="section-title">כל הלוקים</div>
    <div class="section-count" id="allCount"></div>
  </div>
  <div class="history-list" id="allList"></div>
</div>

<!-- ══ SEARCH ══ -->
<div class="screen" id="screen-search">
  <div class="safe-top"></div>
  <div style="padding:16px 20px 0;">
    <div style="font-family:'Fraunces',serif;font-size:42px;font-weight:900;font-style:italic;color:var(--olive);">חיפוש</div>
    <div style="font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--dark);opacity:0.4;margin-top:2px;">לפי שם, צבע, פריט</div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search-input" id="searchInput" placeholder="חפשי לוק..." oninput="doSearch()">
  </div>
  <div class="filter-chips" id="filterChips"></div>
  <div class="search-results" id="searchResults"></div>
</div>

<!-- NAV -->
<div class="nav-bar">
  <button class="nav-item active" id="nav-home" onclick="goScreen('home')">
    <div class="nav-dot"></div>
    היום
  </button>
  <button class="nav-item" id="nav-history" onclick="goScreen('history')">
    <div class="nav-dot-empty"></div>
    היסטוריה
  </button>
  <button class="nav-item" id="nav-search" onclick="goScreen('search')">
    <div class="nav-dot-empty"></div>
    חיפוש
  </button>
</div>

</div>
<script>
const PIECES = ['עליון', 'תחתון', 'נעליים', 'אביזר'];

const NEUTRALS = [
  { name: 'Ivory Mist', hex: '#F5EFE0' },
  { name: 'Pale Linen', hex: '#EDE5D4' },
  { name: 'Warm Chalk', hex: '#E8E0D2' },
  { name: 'Sand Drift', hex: '#D4C4A8' },
  { name: 'Aged Cream', hex: '#C8B898' },
  { name: 'Parchment', hex: '#C0A882' },
  { name: 'Silver Fog', hex: '#B0ACAA' },
  { name: 'White Stone', hex: '#E8E4E0' },
  { name: 'Ash', hex: '#7A7470' },
  { name: 'Slate', hex: '#4A4642' },
  { name: 'Charcoal', hex: '#2E2A26' },
  { name: 'Noir', hex: '#1A1614' },
  { name: 'Camel', hex: '#B89060' },
  { name: 'Cognac', hex: '#8B5E3C' },
  { name: 'Bark', hex: '#6B4226' },
  { name: 'Dark Earth', hex: '#3E2614' },
];

const ACCENTS = [
  { name: 'Venetian Red', hex: '#A83828', family: 'warm' },
  { name: 'Rust', hex: '#B85C38', family: 'warm' },
  { name: 'Persimmon', hex: '#D4572A', family: 'warm' },
  { name: 'Terracotta', hex: '#C4714A', family: 'warm' },
  { name: 'Peach Bloom', hex: '#E8B49A', family: 'warm' },
  { name: 'Dusty Rose', hex: '#C49090', family: 'warm' },
  { name: 'Faded Blush', hex: '#E8C4BC', family: 'warm' },
  { name: 'Antique Rose', hex: '#B87878', family: 'warm' },
  { name: 'Smoked Plum', hex: '#6B3A5A', family: 'purple' },
  { name: 'Deep Bordeaux', hex: '#5C1A2E', family: 'purple' },
  { name: 'Mulberry', hex: '#8B4B6B', family: 'purple' },
  { name: 'Fig', hex: '#4A2040', family: 'purple' },
  { name: 'Indigo', hex: '#2E3A6B', family: 'blue' },
  { name: 'Midnight Blue', hex: '#1C2B3A', family: 'blue' },
  { name: 'Slate Blue', hex: '#5A6B8A', family: 'blue' },
  { name: 'Dove Blue', hex: '#8A9AB0', family: 'blue' },
  { name: 'Forest', hex: '#2C3E2D', family: 'green' },
  { name: 'Sage', hex: '#7A9A7E', family: 'green' },
  { name: 'Ash Willow', hex: '#A0AE9A', family: 'green' },
  { name: 'Moss', hex: '#5C6B4A', family: 'green' },
  { name: 'Olive', hex: '#6B6A38', family: 'green' },
  { name: 'Amber', hex: '#C8A030', family: 'gold' },
  { name: 'Honey Gold', hex: '#D4A853', family: 'gold' },
  { name: 'Warm Yellow', hex: '#E8C84A', family: 'gold' },
  { name: 'Mustard', hex: '#B89428', family: 'gold' },
  { name: 'Khaki', hex: '#9A9062', family: 'gold' },
];

const PAIRINGS = [
  ['warm','blue'],['warm','green'],['warm','gold'],
  ['purple','gold'],['purple','green'],['purple','blue'],
  ['blue','green'],['blue','gold'],['green','gold'],['warm','purple'],
];

const ACCENT_COLORS = ['#E8527A','#4E6020','#E87040','#9B7EC8','#2A8C7A','#F0C430'];

function pickRandom(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

function generateLook(recentNames=[]) {
  let attempts = 0;
  while(attempts < 50) {
    attempts++;
    const pair = pickRandom(PAIRINGS);
    const a1 = pickRandom(ACCENTS.filter(a=>a.family===pair[0]));
    const a2 = pickRandom(ACCENTS.filter(a=>a.family===pair[1]));
    if(a1.name===a2.name) continue;
    const n1 = pickRandom(NEUTRALS);
    let n2 = pickRandom(NEUTRALS);
    while(n2.name===n1.name) n2 = pickRandom(NEUTRALS);
    const pieces = [a1.name,a2.name,n1.name,n2.name];
    for(let i=pieces.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pieces[i],pieces[j]]=[pieces[j],pieces[i]];}
    const vibrant = [a1,a2].sort((a,b)=>{
      const sat=c=>{const r=parseInt(c.hex.slice(1,3),16),g=parseInt(c.hex.slice(3,5),16),b=parseInt(c.hex.slice(5,7),16);return Math.max(r,g,b)-Math.min(r,g,b);};
      return sat(b)-sat(a);
    })[0];
    const name = a1.name+' & '+a2.name;
    if(recentNames.includes(name)) continue;
    return {name,pieces,accent:vibrant.name};
  }
  return {name:'Rust & Indigo',pieces:['Rust','Indigo','Ivory Mist','Charcoal'],accent:'Rust'};
}

function getColor(name) { return [...NEUTRALS,...ACCENTS].find(c=>c.name===name)||{name,hex:'#888'}; }

let state = {today:null,todaySaved:false,history:[],searchFilter:null};

function loadState() {
  const s = localStorage.getItem('palette-v2');
  if(s){try{state={...state,...JSON.parse(s)};}catch(e){}}
  if(!state.today) state.today = generateLook([]);
}

function saveState() { localStorage.setItem('palette-v2',JSON.stringify(state)); }

function shuffle(silent=false) {
  const recent = state.history.slice(0,8).map(h=>h.name);
  state.today = generateLook(recent);
  state.todaySaved = false;
  saveState(); renderHome();
  if(!silent){
    const icon=document.getElementById('shuffleIcon');
    icon.classList.remove('spinning');void icon.offsetWidth;icon.classList.add('spinning');
    setTimeout(()=>icon.classList.remove('spinning'),400);
    document.getElementById('saveBtn').classList.remove('saved');
  }
}

function saveCurrent() {
  if(!state.today) return;
  if(state.todaySaved){showToast('כבר נשמר ✓');return;}
  state.history.unshift({...state.today,date:formatDate(new Date())});
  if(state.history.length>100) state.history=state.history.slice(0,100);
  state.todaySaved=true;
  saveState();renderHome();renderHistory();doSearch();
  document.getElementById('saveBtn').classList.add('saved');
  showToast('נשמר! ✨');
}

function formatDate(d){return `${d.getDate()}.${d.getMonth()+1}.${d.getFullYear().toString().slice(2)}`;}

function formatDateHebrew(str){
  if(!str) return '';
  const months=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  const p=str.split('.');if(p.length<3) return str;
  return `${p[0]} ב${months[parseInt(p[1])-1]} 20${p[2]}`;
}

function renderHome() {
  if(!state.today) return;
  const t = state.today;
  const accent = getColor(t.accent);
  document.getElementById('todayName').textContent = t.name;
  document.getElementById('todayAccentDot').style.background = accent.hex;
  document.getElementById('todayAccentText').textContent = 'זריקה: '+accent.name;

  const grid = document.getElementById('todayGrid');
  grid.innerHTML = PIECES.map((label,i)=>{
    const c = getColor(t.pieces[i]);
    return `
      <div class="circle-item">
        <div class="big-circle" style="background:${c.hex};"></div>
        <div class="circle-label">${label}</div>
        <div class="circle-name">${c.name}</div>
      </div>
      ${i<3?'<div class="circle-divider"></div>':''}`;
  }).join('');

  const list=document.getElementById('homeList');
  const count=document.getElementById('homeCount');
  count.textContent=state.history.length?`${state.history.length} לוקים`:'';
  if(!state.history.length){
    list.innerHTML=`<div class="empty-state"><div class="empty-icon">👗</div><p>שמרי לוק ראשון!</p></div>`;return;
  }
  list.innerHTML=state.history.slice(0,4).map((h,i)=>historyItemHTML(h,i)).join('');
}

function historyItemHTML(h,i) {
  const dots=h.pieces.slice(0,4).map(p=>{const c=getColor(p);return `<div class="h-dot" style="background:${c.hex};"></div>`;}).join('');
  const accent=getColor(h.accent);
  const barColor=ACCENT_COLORS[i%ACCENT_COLORS.length];
  return `
    <div class="history-item" onclick="openModal(${i})">
      <div class="history-item-bar" style="background:${barColor};"></div>
      <div class="history-palette">${dots}</div>
      <div class="history-info">
        <div class="history-name">${h.name}</div>
        <div class="history-date">${formatDateHebrew(h.date)}</div>
      </div>
      <div class="history-accent-wrap">
        <div class="h-accent-circle" style="background:${accent.hex};"></div>
        <div class="h-accent-label">${accent.name.split(' ')[0]}</div>
      </div>
    </div>`;
}

function renderHistory() {
  const list=document.getElementById('allList');
  const count=document.getElementById('allCount');
  const sub=document.getElementById('historySubtitle');
  count.textContent=state.history.length?`${state.history.length} לוקים`:'';
  sub.textContent=state.history.length?`${state.history.length} לוקים מתועדים`:'עדיין ריק';
  if(!state.history.length){
    list.innerHTML=`<div class="empty-state"><div class="empty-icon">📖</div><p>ההיסטוריה שלך תופיע כאן</p></div>`;return;
  }
  list.innerHTML=state.history.map((h,i)=>historyItemHTML(h,i)).join('');
}

function openModal(index) {
  const h=state.history[index];if(!h) return;
  document.getElementById('modalName').textContent=h.name;
  document.getElementById('modalDate').textContent=formatDateHebrew(h.date);
  document.getElementById('modalGrid').innerHTML=PIECES.map((label,i)=>{
    const c=getColor(h.pieces[i]);
    return `<div class="modal-circle-item">
      <div class="modal-circle" style="background:${c.hex};"></div>
      <div class="modal-piece-label">${label}</div>
      <div class="modal-piece-name">${c.name}</div>
    </div>`;
  }).join('');
  document.getElementById('modalDelete').onclick=()=>deleteEntry(index);
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(e){
  if(e&&e.target!==document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('show');
}

function deleteEntry(index){
  state.history.splice(index,1);saveState();
  renderHome();renderHistory();doSearch();
  document.getElementById('modalOverlay').classList.remove('show');
  showToast('נמחק');
}

const FILTER_OPTIONS=['נייטרל','צבע','כהה','בהיר'];

function buildFilterChips(){
  document.getElementById('filterChips').innerHTML=FILTER_OPTIONS.map(f=>
    `<div class="chip ${state.searchFilter===f?'active':''}" onclick="toggleFilter('${f}')">${f}</div>`
  ).join('');
}

function toggleFilter(f){state.searchFilter=state.searchFilter===f?null:f;buildFilterChips();doSearch();}

function lookMatchesFilter(h,f){
  const neutrals=NEUTRALS.map(n=>n.name);
  if(f==='נייטרל') return h.pieces.every(p=>neutrals.includes(p));
  if(f==='צבע') return h.pieces.some(p=>!neutrals.includes(p));
  const lum=p=>{const c=getColor(p),r=parseInt(c.hex.slice(1,3),16),g=parseInt(c.hex.slice(3,5),16),b=parseInt(c.hex.slice(5,7),16);return (r+g+b)/3;};
  if(f==='כהה') return h.pieces.filter(p=>lum(p)<80).length>=2;
  if(f==='בהיר') return h.pieces.filter(p=>lum(p)>180).length>=2;
  return true;
}

function doSearch(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  let results=[...state.history];
  if(state.searchFilter) results=results.filter(h=>lookMatchesFilter(h,state.searchFilter));
  if(q) results=results.filter(h=>h.name.toLowerCase().includes(q)||h.pieces.some(p=>p.toLowerCase().includes(q))||h.accent.toLowerCase().includes(q));
  const el=document.getElementById('searchResults');
  if(!q&&!state.searchFilter){el.innerHTML=`<div class="empty-state"><div class="empty-icon">🔍</div><p>חפשי לפי שם, צבע או פריט</p></div>`;return;}
  if(!results.length){el.innerHTML=`<div class="empty-state"><div class="empty-icon">🤷‍♀️</div><p>לא נמצאו תוצאות</p></div>`;return;}
  el.innerHTML=results.map((h,i)=>historyItemHTML(h,i)).join('');
}

function goScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>{n.classList.remove('active');n.querySelector('div').className='nav-dot-empty';});
  document.getElementById('screen-'+name).classList.add('active');
  const btn=document.getElementById('nav-'+name);
  btn.classList.add('active');btn.querySelector('div').className='nav-dot';
  if(name==='search'){buildFilterChips();doSearch();setTimeout(()=>document.getElementById('searchInput').focus(),300);}
}

let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2000);
}

loadState();renderHome();renderHistory();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/palette/service-worker.js');});}

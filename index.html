<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palette">
<title>Palette</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@1,400;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#FAFAF8;
  --dark:#1A1410;
  --muted:#AAAAAA;
  --border:#E0DDD8;
  --accent:#B85C38;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--dark);font-family:'DM Sans',sans-serif;overflow:hidden;}
.app{height:100%;max-width:430px;margin:0 auto;position:relative;}
.screen{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 0.3s;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(80px + var(--safe-bottom));}
.screen.active{opacity:1;pointer-events:all;}
.safe-top{height:env(safe-area-inset-top,20px);}

/* ISSUE BAR */
.issue-bar{background:var(--dark);padding:5px 22px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.issue-text{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:rgba(250,250,248,0.45);}
.issue-num{font-size:8px;letter-spacing:2px;color:var(--accent);}

/* HEADER */
.mag-header{padding:12px 22px 0;border-bottom:2px solid var(--dark);}
.mag-title{font-family:'Bebas Neue',sans-serif;font-size:62px;color:var(--dark);line-height:0.9;letter-spacing:2px;}
.mag-sub{font-size:8px;letter-spacing:4px;text-transform:uppercase;color:var(--accent);margin:3px 0 10px;}

/* LOOK SECTION */
.look-section{padding:16px 22px 0;}
.look-eyebrow{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.look-name{font-family:'Bebas Neue',sans-serif;font-size:44px;color:var(--dark);line-height:0.95;letter-spacing:1px;margin-bottom:5px;}
.accent-row{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;}
.accent-dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,0.1);flex-shrink:0;}
.accent-name{font-size:12px;font-weight:500;color:var(--dark);}

/* PIECES GRID */
.pieces-row{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--dark);border-bottom:1px solid var(--dark);margin:0 -22px;padding:0 22px;}
.piece-col{padding:12px 5px;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:5px;}
.piece-col:last-child{border-right:none;}
.piece-swatch{width:42px;height:42px;border-radius:50%;border:1px solid rgba(0,0,0,0.08);position:relative;overflow:hidden;flex-shrink:0;}
.piece-swatch::after{content:'';position:absolute;top:14%;left:14%;width:28%;height:28%;background:rgba(255,255,255,0.2);border-radius:50%;}
.piece-label{font-size:7px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-align:center;}
.piece-name{font-family:'Playfair Display',serif;font-size:9px;font-style:italic;color:var(--dark);text-align:center;line-height:1.2;}

/* BUTTONS */
.btns-row{display:flex;gap:10px;padding:12px 22px;border-bottom:1px solid var(--border);}
.next-btn{flex:1;background:var(--dark);border:none;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:opacity 0.15s;}
.next-btn:active{opacity:0.85;}
.next-btn-text{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--bg);letter-spacing:1px;}
.next-btn-icon{font-size:16px;color:var(--accent);}
.wore-btn{background:var(--accent);border:none;padding:14px 16px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:white;cursor:pointer;transition:opacity 0.15s;flex-shrink:0;}
.wore-btn:active{opacity:0.85;}
.wore-btn.worn{background:#4A3A2A;color:rgba(255,255,255,0.7);}
.save-btn{background:transparent;border:1px solid var(--dark);padding:14px 16px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dark);cursor:pointer;flex-shrink:0;}
.save-btn.saved{background:var(--dark);color:var(--bg);}

/* LOOKBOOK SECTION */
.lookbook-section{padding:16px 22px 0;}
.lookbook-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--dark);margin-bottom:12px;}
.look-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity 0.15s;}
.look-row:active{opacity:0.7;}
.look-row:last-child{border-bottom:none;}
.look-no{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--border);width:24px;text-align:center;flex-shrink:0;}
.look-dots{display:flex;gap:4px;flex-shrink:0;}
.l-dot{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,0.07);position:relative;overflow:hidden;flex-shrink:0;}
.l-dot::after{content:'';position:absolute;top:16%;left:16%;width:28%;height:28%;background:rgba(255,255,255,0.3);border-radius:50%;}
.look-info{flex:1;}
.look-item-name{font-family:'Playfair Display',serif;font-size:14px;font-style:italic;color:var(--dark);line-height:1.2;}
.look-item-date{font-size:9px;letter-spacing:1px;color:var(--muted);margin-top:2px;}
.worn-badge{font-size:8px;letter-spacing:1px;background:var(--accent);color:white;padding:2px 7px;flex-shrink:0;}
.look-accent-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,0.08);}

/* MONTHLY LOOKBOOK */
.month-section{padding:16px 22px 0;}
.month-header{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
.month-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--dark);}
.month-count{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.month-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
.month-card{border-radius:12px;padding:14px 12px 10px;cursor:pointer;transition:transform 0.15s;min-height:90px;display:flex;flex-direction:column;justify-content:space-between;}
.month-card:active{transform:scale(0.97);}
.mc-name{font-family:'Playfair Display',serif;font-size:12px;font-style:italic;font-weight:700;line-height:1.2;margin-bottom:4px;}
.mc-dots{display:flex;gap:4px;}
.mc-dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);}
.mc-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.mc-date{font-size:8px;opacity:0.55;}
.mc-worn{font-size:7px;letter-spacing:1px;background:rgba(255,255,255,0.2);color:rgba(255,255,255,0.85);padding:2px 6px;}

/* SEARCH */
.search-section{padding:14px 22px 0;}
.search-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);padding:10px 0;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--dark);outline:none;direction:rtl;}
.search-input::placeholder{color:var(--muted);font-style:italic;}
.search-input:focus{border-bottom-color:var(--dark);}
.filter-chips{display:flex;gap:7px;padding:12px 22px 0;overflow-x:auto;}
.filter-chips::-webkit-scrollbar{display:none;}
.chip{background:transparent;border:1px solid var(--border);padding:5px 12px;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);white-space:nowrap;cursor:pointer;transition:all 0.15s;flex-shrink:0;}
.chip.active{background:var(--dark);color:var(--bg);border-color:var(--dark);}
.search-results{padding:12px 22px 0;display:flex;flex-direction:column;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(26,20,16,0.45);z-index:150;opacity:0;pointer-events:none;transition:opacity 0.3s;backdrop-filter:blur(4px);}
.modal-overlay.show{opacity:1;pointer-events:all;}
.modal{position:absolute;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;background:var(--bg);padding:20px 22px calc(28px + var(--safe-bottom));transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.34,1.2,0.64,1);}
.modal-overlay.show .modal{transform:translateY(0);}
.modal-handle{width:32px;height:2px;background:var(--border);margin:0 auto 18px;}
.modal-issue{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}
.modal-name{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:1px;color:var(--dark);margin-bottom:4px;}
.modal-date{font-size:9px;letter-spacing:1px;color:var(--muted);margin-bottom:16px;}
.modal-pieces{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.modal-piece{display:flex;flex-direction:column;align-items:center;gap:6px;}
.modal-sw{width:46px;height:46px;border-radius:50%;border:1px solid rgba(0,0,0,0.08);position:relative;overflow:hidden;}
.modal-sw::after{content:'';position:absolute;top:14%;left:14%;width:28%;height:28%;background:rgba(255,255,255,0.2);border-radius:50%;}
.modal-piece-label{font-size:7px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.modal-piece-name{font-family:'Playfair Display',serif;font-size:10px;font-style:italic;color:var(--dark);text-align:center;max-width:54px;line-height:1.2;}
.modal-actions{display:flex;gap:8px;}
.modal-wore{flex:1;background:var(--accent);border:none;padding:12px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:white;cursor:pointer;}
.modal-wore.worn{background:#4A3A2A;}
.modal-delete{background:none;border:1px solid rgba(160,60,40,0.2);padding:12px 14px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#A03C28;cursor:pointer;}

/* NAV */
.nav-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(250,250,248,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1.5px solid var(--dark);padding:10px 20px calc(10px + var(--safe-bottom));display:flex;justify-content:space-around;z-index:100;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:7px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);cursor:pointer;border:none;background:none;padding:4px 12px;transition:color 0.2s;}
.nav-item.active{color:var(--dark);}
.nav-line{width:16px;height:1.5px;background:var(--accent);}
.nav-line-empty{width:16px;height:1px;background:var(--border);}

/* TOAST */
.toast{position:fixed;top:calc(env(safe-area-inset-top,20px) + 16px);left:50%;transform:translateX(-50%) translateY(-80px);background:var(--dark);color:var(--bg);padding:9px 20px;font-size:10px;letter-spacing:2px;text-transform:uppercase;z-index:200;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
@keyframes spin{to{transform:rotate(360deg);}}
.spinning{animation:spin 0.4s ease;}
</style>
</head>
<body>
<div class="app">
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-issue" id="modalIssue"></div>
    <div class="modal-name" id="modalName"></div>
    <div class="modal-date" id="modalDate"></div>
    <div class="modal-pieces" id="modalPieces"></div>
    <div class="modal-actions">
      <button class="modal-wore" id="modalWoreBtn" onclick="toggleModalWore()">Wore it ✓</button>
      <button class="modal-delete" id="modalDeleteBtn">מחקי</button>
    </div>
  </div>
</div>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="safe-top"></div>
  <div class="issue-bar">
    <span class="issue-text">Issue No. <span class="issue-num" id="issueNum">001</span></span>
    <span class="issue-text" id="issueDate"></span>
  </div>
  <div class="mag-header">
    <div class="mag-title">PALETTE</div>
    <div class="mag-sub">The Daily Look Edition</div>
  </div>
  <div class="look-section">
    <div class="look-eyebrow">Look of the day</div>
    <div class="look-name" id="todayName">—</div>
    <div class="accent-row">
      <div class="accent-dot" id="accentDot"></div>
      <div class="accent-name" id="accentName"></div>
    </div>
    <div class="pieces-row" id="todayPieces"></div>
  </div>
  <div class="btns-row">
    <button class="next-btn" onclick="shuffle()">
      <span class="next-btn-text">NEXT LOOK →</span>
      <span class="next-btn-icon" id="shuffleIcon">↻</span>
    </button>
    <button class="save-btn" id="saveBtn" onclick="saveCurrent()">שמרי</button>
  </div>
  <div class="lookbook-section">
    <div class="lookbook-title">LOOKBOOK</div>
    <div id="homeList"></div>
  </div>
</div>

<!-- LOOKBOOK MONTHLY -->
<div class="screen" id="screen-lookbook">
  <div class="safe-top"></div>
  <div class="issue-bar">
    <span class="issue-text">LOOKBOOK</span>
    <span class="issue-num" id="lookbookTotal"></span>
  </div>
  <div class="mag-header">
    <div class="mag-title">LOOKBOOK</div>
    <div class="mag-sub" id="lookbookSub">כל הלוקים שלך</div>
  </div>
  <div id="monthlyContent" style="padding-bottom:10px;"></div>
</div>

<!-- SEARCH -->
<div class="screen" id="screen-search">
  <div class="safe-top"></div>
  <div class="issue-bar">
    <span class="issue-text">SEARCH</span>
    <span class="issue-num">Recherche</span>
  </div>
  <div class="mag-header">
    <div class="mag-title">חיפוש</div>
    <div class="mag-sub">By name, color, piece</div>
  </div>
  <div class="search-section">
    <input class="search-input" id="searchInput" placeholder="Search looks..." oninput="doSearch()">
  </div>
  <div class="filter-chips" id="filterChips"></div>
  <div class="search-results" id="searchResults"></div>
</div>

<div class="nav-bar">
  <button class="nav-item active" id="nav-home" onclick="goScreen('home')">
    <div class="nav-line"></div>היום
  </button>
  <button class="nav-item" id="nav-lookbook" onclick="goScreen('lookbook')">
    <div class="nav-line-empty"></div>לוקבוק
  </button>
  <button class="nav-item" id="nav-search" onclick="goScreen('search')">
    <div class="nav-line-empty"></div>חיפוש
  </button>
</div>
</div>

<script>
var PIECES=['עליון','תחתון','נעליים','אביזר'];

var ALL_COLORS=[
  {name:'Ivory Mist',hex:'#F5EFE0',family:'neutral',warmth:9},
  {name:'Pale Linen',hex:'#EDE5D4',family:'neutral',warmth:8},
  {name:'Warm Chalk',hex:'#E8E0D2',family:'neutral',warmth:7},
  {name:'Sand Drift',hex:'#D4C4A8',family:'neutral',warmth:7},
  {name:'Aged Cream',hex:'#C8B898',family:'neutral',warmth:6},
  {name:'Parchment',hex:'#C0A882',family:'neutral',warmth:6},
  {name:'Silver Fog',hex:'#B0ACAA',family:'neutral',warmth:0},
  {name:'White Stone',hex:'#E8E4E0',family:'neutral',warmth:2},
  {name:'Camel',hex:'#B89060',family:'neutral',warmth:5},
  {name:'Cognac',hex:'#8B5E3C',family:'neutral',warmth:4},
  {name:'Bark',hex:'#6B4226',family:'neutral',warmth:3},
  {name:'Dark Earth',hex:'#3E2614',family:'neutral',warmth:2},
  {name:'Ash',hex:'#7A7470',family:'neutral',warmth:0},
  {name:'Slate',hex:'#4A4642',family:'neutral',warmth:0},
  {name:'Charcoal',hex:'#2E2A26',family:'neutral',warmth:0},
  {name:'Noir',hex:'#1A1614',family:'neutral',warmth:0},
  {name:'Venetian Red',hex:'#A83828',family:'warm'},
  {name:'Cherry',hex:'#8B1A2E',family:'warm'},
  {name:'Crimson',hex:'#C41E3A',family:'warm'},
  {name:'Rust',hex:'#B85C38',family:'warm'},
  {name:'Persimmon',hex:'#D4572A',family:'warm'},
  {name:'Terracotta',hex:'#C4714A',family:'warm'},
  {name:'Peach Bloom',hex:'#E8B49A',family:'warm'},
  {name:'Dusty Rose',hex:'#C49090',family:'warm'},
  {name:'Faded Blush',hex:'#E8C4BC',family:'warm'},
  {name:'Antique Rose',hex:'#B87878',family:'warm'},
  {name:'Coral',hex:'#D4604A',family:'warm'},
  {name:'Smoked Plum',hex:'#6B3A5A',family:'purple'},
  {name:'Deep Bordeaux',hex:'#5C1A2E',family:'purple'},
  {name:'Mulberry',hex:'#8B4B6B',family:'purple'},
  {name:'Fig',hex:'#4A2040',family:'purple'},
  {name:'Lavender',hex:'#B4A0C8',family:'purple'},
  {name:'Mauve',hex:'#9A7090',family:'purple'},
  {name:'Wisteria',hex:'#C4A0C8',family:'purple'},
  {name:'Indigo',hex:'#2E3A6B',family:'blue'},
  {name:'Midnight Blue',hex:'#1C2B3A',family:'blue'},
  {name:'Cobalt',hex:'#2A4A8A',family:'blue'},
  {name:'Slate Blue',hex:'#5A6B8A',family:'blue'},
  {name:'Dove Blue',hex:'#8A9AB0',family:'blue'},
  {name:'Forest',hex:'#2C3E2D',family:'green'},
  {name:'Sage',hex:'#7A9A7E',family:'green'},
  {name:'Moss',hex:'#5C6B4A',family:'green'},
  {name:'Olive',hex:'#6B6A38',family:'green'},
  {name:'Hunter',hex:'#2A4A2E',family:'green'},
  {name:'Amber',hex:'#C8A030',family:'gold'},
  {name:'Honey Gold',hex:'#D4A853',family:'gold'},
  {name:'Warm Yellow',hex:'#E8C84A',family:'gold'},
  {name:'Mustard',hex:'#B89428',family:'gold'},
  {name:'Champagne',hex:'#D4C090',family:'gold'},
];

// Sanzo Wada harmony types
var HARMONY_TYPES=[
  // אנלוגי — צבעים שכנים
  {type:'analogous',slots:['warm','warm','neutral','neutral']},
  {type:'analogous',slots:['purple','purple','neutral','neutral']},
  {type:'analogous',slots:['blue','blue','neutral','neutral']},
  {type:'analogous',slots:['green','green','neutral','neutral']},
  {type:'analogous',slots:['gold','gold','neutral','neutral']},
  {type:'analogous',slots:['warm','purple','neutral','neutral']},
  {type:'analogous',slots:['blue','purple','neutral','neutral']},
  {type:'analogous',slots:['blue','green','neutral','neutral']},
  {type:'analogous',slots:['green','gold','neutral','neutral']},
  // קומפלמנטרי — ניגודים
  {type:'complementary',slots:['warm','blue','neutral','neutral']},
  {type:'complementary',slots:['warm','green','neutral','neutral']},
  {type:'complementary',slots:['purple','gold','neutral','neutral']},
  {type:'complementary',slots:['blue','gold','neutral','neutral']},
  {type:'complementary',slots:['warm','blue','warm','neutral']},
  {type:'complementary',slots:['purple','green','neutral','neutral']},
  // טריאדה — 3 צבעים
  {type:'triad',slots:['warm','blue','gold','neutral']},
  {type:'triad',slots:['warm','green','gold','neutral']},
  {type:'triad',slots:['purple','green','warm','neutral']},
  {type:'triad',slots:['blue','gold','warm','neutral']},
  {type:'triad',slots:['purple','gold','blue','neutral']},
  // אקצנט חד — ניטרלים עם זריקה
  {type:'accent',slots:['warm','neutral','neutral','neutral']},
  {type:'accent',slots:['purple','neutral','neutral','neutral']},
  {type:'accent',slots:['blue','neutral','neutral','neutral']},
  {type:'accent',slots:['green','neutral','neutral','neutral']},
  {type:'accent',slots:['gold','neutral','neutral','neutral']},
  // מלא — כולם צבעוניים
  {type:'full',slots:['warm','blue','green','gold']},
  {type:'full',slots:['warm','purple','blue','gold']},
  {type:'full',slots:['purple','green','warm','blue']},
  {type:'full',slots:['warm','green','purple','gold']},
];

function pickRandom(arr){return arr[Math.floor(Math.random()*arr.length)];}
function getByFamily(f){return ALL_COLORS.filter(function(c){return c.family===f;});}

function generateLook(recentNames,recentColorNames){
  recentNames=recentNames||[];
  recentColorNames=recentColorNames||[];

  // Score penalty for recently used colors
  function colorPenalty(name){
    var idx=recentColorNames.indexOf(name);
    if(idx===-1)return 0;
    if(idx<4)return 100;
    if(idx<8)return 50;
    if(idx<12)return 20;
    return 5;
  }

  function pickColorFromFamily(fam,usedInLook){
    var pool=getByFamily(fam).filter(function(c){
      return usedInLook.indexOf(c.name)===-1;
    });
    if(!pool.length)pool=getByFamily(fam);
    // weighted pick — penalize recently used
    var weights=pool.map(function(c){return Math.max(1,100-colorPenalty(c.name));});
    var total=weights.reduce(function(a,b){return a+b;},0);
    var r=Math.random()*total,acc=0;
    for(var i=0;i<pool.length;i++){acc+=weights[i];if(r<acc)return pool[i];}
    return pool[pool.length-1];
  }

  for(var attempts=0;attempts<60;attempts++){
    var harmony=pickRandom(HARMONY_TYPES);

    // Pick 4 colors for the 4 pieces
    var usedInLook=[];
    var colors=[];
    var ok=true;
    for(var i=0;i<4;i++){
      var fam=harmony.slots[i];
      var c=pickColorFromFamily(fam,usedInLook);
      if(!c){ok=false;break;}
      usedInLook.push(c.name);
      colors.push(c);
    }
    if(!ok)continue;

    // Shuffle pieces
    var pieces=colors.slice();
    for(var si=pieces.length-1;si>0;si--){
      var sj=Math.floor(Math.random()*(si+1));
      var st=pieces[si];pieces[si]=pieces[sj];pieces[sj]=st;
    }

    // Find accent — most saturated non-neutral
    var accent=pieces[0];
    var maxSat=0;
    for(var pi=0;pi<pieces.length;pi++){
      var pc=pieces[pi];
      if(pc.family==='neutral')continue;
      var r2=parseInt(pc.hex.slice(1,3),16);
      var g2=parseInt(pc.hex.slice(3,5),16);
      var b2=parseInt(pc.hex.slice(5,7),16);
      var sat=Math.max(r2,g2,b2)-Math.min(r2,g2,b2);
      if(sat>maxSat){maxSat=sat;accent=pc;}
    }

    // Build name from non-neutral colors
    var nameColors=pieces.filter(function(c){return c.family!=='neutral';});
    if(!nameColors.length)nameColors=[pieces[0]];
    var name=nameColors.map(function(c){return c.name;}).join(' & ');

    if(recentNames.indexOf(name)!==-1)continue;

    return{
      name:name,
      accent:accent,
      pieces:pieces.map(function(c){return c.name;}),
      harmonyType:harmony.type,
    };
  }
  return{name:'Rust & Ivory',accent:{name:'Rust',hex:'#B85C38'},pieces:['Rust','Ivory Mist','Dark Earth','Camel'],harmonyType:'accent'};
}

function getColor(name){
  for(var i=0;i<ALL_COLORS.length;i++)if(ALL_COLORS[i].name===name)return ALL_COLORS[i];
  return{name:name,hex:'#888',family:'neutral'};
}

// STATE
var state={today:null,todaySaved:false,history:[],issueCount:0};

function loadState(){
  try{var s=localStorage.getItem('palette-v3');if(s){var p=JSON.parse(s);state.today=p.today||null;state.history=p.history||[];state.issueCount=p.issueCount||0;}}catch(e){}
  if(!state.today){state.today=generateLook([],[]);state.issueCount=1;}
}
function saveState(){try{localStorage.setItem('palette-v3',JSON.stringify(state));}catch(e){}}

function formatDate(d){return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear().toString().slice(2);}
function getMonthName(monthNum){
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return months[monthNum];
}

function getRecentNames(){return state.history.slice(0,20).map(function(h){return h.name;});}
function getRecentColors(){
  var colors=[];
  for(var i=0;i<Math.min(20,state.history.length);i++){
    for(var j=0;j<state.history[i].pieces.length;j++){
      if(colors.indexOf(state.history[i].pieces[j])===-1)colors.push(state.history[i].pieces[j]);
    }
  }
  return colors;
}

function shuffle(){
  state.today=generateLook(getRecentNames(),getRecentColors());
  state.todaySaved=false;
  state.issueCount++;
  saveState();renderHome();
  var icon=document.getElementById('shuffleIcon');
  icon.classList.remove('spinning');void icon.offsetWidth;icon.classList.add('spinning');
  setTimeout(function(){icon.classList.remove('spinning');},400);
  document.getElementById('saveBtn').classList.remove('saved');
}

function saveCurrent(){
  if(!state.today)return;
  if(state.todaySaved){showToast('כבר נשמר');return;}
  var today=new Date();
  state.history.unshift({
    name:state.today.name,accent:state.today.accent,
    pieces:state.today.pieces,no:state.issueCount,
    date:formatDate(today),month:today.getMonth(),year:today.getFullYear(),
    worn:false,
  });
  if(state.history.length>200)state.history=state.history.slice(0,200);
  state.todaySaved=true;
  saveState();renderAll();
  document.getElementById('saveBtn').classList.add('saved');
  showToast('Saved ✓');
}

function toggleWore(index){
  if(index<0||index>=state.history.length)return;
  state.history[index].worn=!state.history[index].worn;
  saveState();renderAll();
  showToast(state.history[index].worn?'Wore it ✓':'הוסר');
}

function renderAll(){
  renderHome();
  renderLookbook();
  doSearch();
}

function lookCardColor(look){
  var accent=look.accent||{hex:'#2A2020'};
  return accent.hex;
}

function lookRowHTML(h,i){
  var dots=h.pieces.slice(0,4).map(function(p){
    var c=getColor(p);
    return'<div class="l-dot" style="background:'+c.hex+';"></div>';
  }).join('');
  var wornBadge=h.worn?'<div class="worn-badge">Wore it</div>':'';
  var accent=h.accent||{hex:'#888'};
  return'<div class="look-row" onclick="openModal('+i+')">'
    +'<div class="look-no">'+String(h.no||i+1).padStart(2,'0')+'</div>'
    +'<div class="look-dots">'+dots+'</div>'
    +'<div class="look-info"><div class="look-item-name">'+h.name+'</div><div class="look-item-date">'+h.date+'</div></div>'
    +wornBadge
    +'<div class="look-accent-dot" style="background:'+accent.hex+';border:1px solid rgba(0,0,0,0.08);"></div>'
    +'</div>';
}

function renderHome(){
  if(!state.today)return;
  var t=state.today;
  document.getElementById('issueNum').textContent=String(state.issueCount).padStart(3,'0');
  var today=new Date();
  document.getElementById('issueDate').textContent=today.getDate()+'.'+(today.getMonth()+1)+'.'+String(today.getFullYear()).slice(2);
  document.getElementById('todayName').textContent=t.name;
  document.getElementById('accentDot').style.background=t.accent.hex;
  document.getElementById('accentName').textContent=t.accent.name+' — זריקת הצבע';

  var pHTML='';
  for(var i=0;i<4;i++){
    var c=getColor(t.pieces[i]||'Ivory Mist');
    pHTML+='<div class="piece-col">'
      +'<div class="piece-swatch" style="background:'+c.hex+';"></div>'
      +'<div class="piece-label">'+PIECES[i]+'</div>'
      +'<div class="piece-name">'+c.name+'</div>'
      +'</div>';
  }
  document.getElementById('todayPieces').innerHTML=pHTML;

  var list=document.getElementById('homeList');
  if(!state.history.length){
    list.innerHTML='<div style="text-align:center;padding:40px 0;font-family:\'Playfair Display\',serif;font-size:16px;font-style:italic;color:var(--muted);">Save your first look</div>';
    return;
  }
  var html='';
  for(var i=0;i<Math.min(5,state.history.length);i++)html+=lookRowHTML(state.history[i],i);
  list.innerHTML=html;
}

function renderLookbook(){
  var total=state.history.length;
  document.getElementById('lookbookTotal').textContent=total+' looks';
  document.getElementById('lookbookSub').textContent=total?total+' looks saved':'No looks yet';

  if(!total){
    document.getElementById('monthlyContent').innerHTML='<div style="text-align:center;padding:50px 22px;font-family:\'Playfair Display\',serif;font-size:18px;font-style:italic;color:var(--muted);">Your lookbook is empty</div>';
    return;
  }

  // Group by month
  var months={};
  for(var i=0;i<state.history.length;i++){
    var h=state.history[i];
    var key=(h.year||2026)+'-'+(h.month!==undefined?h.month:0);
    if(!months[key])months[key]={year:h.year||2026,month:h.month||0,looks:[]};
    months[key].looks.push({look:h,idx:i});
  }

  var keys=Object.keys(months).sort(function(a,b){return b.localeCompare(a);});
  var html='';
  for(var ki=0;ki<keys.length;ki++){
    var m=months[keys[ki]];
    html+='<div class="month-section">'
      +'<div class="month-header">'
      +'<div class="month-name">'+getMonthName(m.month).toUpperCase()+'</div>'
      +'<div class="month-count">'+m.looks.length+' looks</div>'
      +'</div>'
      +'<div class="month-grid">';

    for(var li=0;li<m.looks.length;li++){
      var ldata=m.looks[li];
      var h2=ldata.look;
      var bgColor=h2.accent?h2.accent.hex:'#2A2020';
      var dots=h2.pieces.slice(0,4).map(function(p){
        var c=getColor(p);
        return'<div class="mc-dot" style="background:'+c.hex+';"></div>';
      }).join('');
      var wornBadge=h2.worn?'<div class="mc-worn">Wore it ✓</div>':'';
      html+='<div class="month-card" style="background:'+bgColor+';" onclick="openModal('+ldata.idx+')">'
        +'<div><div class="mc-name" style="color:rgba(250,250,248,0.95);">'+h2.name+'</div>'
        +'<div class="mc-dots">'+dots+'</div></div>'
        +'<div class="mc-bottom" style="color:rgba(250,250,248,0.6);">'
        +'<div class="mc-date">'+h2.date+'</div>'
        +wornBadge
        +'</div></div>';
    }
    html+='</div></div>';
  }
  document.getElementById('monthlyContent').innerHTML=html;
}

// MODAL
var modalIndex=null;
function openModal(index){
  var h=state.history[index];if(!h)return;
  modalIndex=index;
  document.getElementById('modalIssue').textContent='Issue No. '+String(h.no||index+1).padStart(3,'0');
  document.getElementById('modalName').textContent=h.name;
  document.getElementById('modalDate').textContent=h.date;
  var html='';
  for(var i=0;i<4;i++){
    var c=getColor(h.pieces[i]||'Ivory Mist');
    html+='<div class="modal-piece">'
      +'<div class="modal-sw" style="background:'+c.hex+';"></div>'
      +'<div class="modal-piece-label">'+PIECES[i]+'</div>'
      +'<div class="modal-piece-name">'+c.name+'</div>'
      +'</div>';
  }
  document.getElementById('modalPieces').innerHTML=html;
  var woreBtn=document.getElementById('modalWoreBtn');
  woreBtn.classList.toggle('worn',h.worn);
  woreBtn.textContent=h.worn?'Worn ✓':'Wore it ✓';
  document.getElementById('modalDeleteBtn').onclick=function(){deleteLook(index);};
  document.getElementById('modalOverlay').classList.add('show');
}

function toggleModalWore(){
  if(modalIndex===null)return;
  toggleWore(modalIndex);
  var h=state.history[modalIndex];
  var btn=document.getElementById('modalWoreBtn');
  btn.classList.toggle('worn',h.worn);
  btn.textContent=h.worn?'Worn ✓':'Wore it ✓';
}

function closeModal(e){if(e&&e.target!==document.getElementById('modalOverlay'))return;document.getElementById('modalOverlay').classList.remove('show');}

function deleteLook(index){
  state.history.splice(index,1);
  saveState();renderAll();
  document.getElementById('modalOverlay').classList.remove('show');
  showToast('Deleted');
}

// SEARCH
var activeFilter=null;
var FILTER_OPTIONS=['נייטרל','צבע','Worn','כהה','בהיר'];

function buildFilterChips(){
  var html='';
  for(var i=0;i<FILTER_OPTIONS.length;i++){
    var f=FILTER_OPTIONS[i];
    html+='<div class="chip'+(activeFilter===f?' active':'')+'" onclick="setFilter(\''+f+'\')">'+f+'</div>';
  }
  document.getElementById('filterChips').innerHTML=html;
}

function setFilter(f){activeFilter=activeFilter===f?null:f;buildFilterChips();doSearch();}

function lum(hex){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return(r+g+b)/3;
}

function doSearch(){
  var inp=document.getElementById('searchInput');var q=inp?inp.value.trim().toLowerCase():'';
  var results=state.history.slice().map(function(h,i){return{h:h,i:i};});
  if(activeFilter){
    results=results.filter(function(item){
      var h=item.h;
      var neutralFams=h.pieces.filter(function(p){return getColor(p).family==='neutral';});
      if(activeFilter==='נייטרל')return neutralFams.length===4;
      if(activeFilter==='צבע')return neutralFams.length<4;
      if(activeFilter==='Worn')return h.worn;
      if(activeFilter==='כהה')return h.pieces.filter(function(p){return lum(getColor(p).hex)<80;}).length>=2;
      if(activeFilter==='בהיר')return h.pieces.filter(function(p){return lum(getColor(p).hex)>180;}).length>=2;
      return true;
    });
  }
  if(q)results=results.filter(function(item){
    var h=item.h;
    return h.name.toLowerCase().indexOf(q)!==-1
      ||(h.accent&&h.accent.name.toLowerCase().indexOf(q)!==-1)
      ||h.pieces.some(function(p){return p.toLowerCase().indexOf(q)!==-1;});
  });
  var el=document.getElementById('searchResults');
  if(!q&&!activeFilter){el.innerHTML='<div style="text-align:center;padding:40px 0;font-family:\'Playfair Display\',serif;font-size:16px;font-style:italic;color:var(--muted);">Search your lookbook</div>';return;}
  if(!results.length){el.innerHTML='<div style="text-align:center;padding:40px 0;font-family:\'Playfair Display\',serif;font-size:16px;font-style:italic;color:var(--muted);">No results</div>';return;}
  var html='';for(var i=0;i<results.length;i++)html+=lookRowHTML(results[i].h,results[i].i);
  el.innerHTML=html;
}

function goScreen(name){
  var screens=document.querySelectorAll('.screen');for(var i=0;i<screens.length;i++)screens[i].classList.remove('active');
  var navs=document.querySelectorAll('.nav-item');for(var i=0;i<navs.length;i++){navs[i].classList.remove('active');navs[i].querySelector('div').className='nav-line-empty';}
  document.getElementById('screen-'+name).classList.add('active');
  var btn=document.getElementById('nav-'+name);btn.classList.add('active');btn.querySelector('div').className='nav-line';
  if(name==='search'){buildFilterChips();doSearch();setTimeout(function(){document.getElementById('searchInput').focus();},300);}
}

var toastTimer;
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2000);}

loadState();renderAll();
</script>

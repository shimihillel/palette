<main>
  <header>
    <p class="brand">SHIMI LOOKS</p>
    <h1>הגוונים שנשארים איתך</h1>
    <p>סמני ✓ ליד גוון שאת רוצה להשאיר. אם הוא מתאים רק לחלק מהפריטים, השאירי אותו מסומן וכתבי הערה.</p>
    <p class="muted">כל הגוונים כאן, כולל החסומים. הבחירה הראשונית משקפת את ההגבלות הקיימות.</p>

    <div class="save-status" id="save-status" role="status"></div>
  </header>
  <nav class="family-nav" id="families" aria-label="משפחות הצבעים"></nav>
  <h2 id="family-heading"></h2>
  <div class="shade-grid" id="shades"></div>
  <div class="family-actions">
    <button type="button" id="previous-family">המשפחה הקודמת</button>
    <button type="button" id="next-family">המשפחה הבאה</button>
  </div>
  <section class="finish" aria-label="שליחת הבחירה">
    <button type="button" class="primary" id="finish">סיימתי, העתיקי את הבחירה</button>
    <p class="muted">אחרי ההעתקה, חזרי לשיחה והדביקי את הבחירה כדי שאעדכן את האפליקציה.</p>
    <p id="copy-feedback" class="copy-feedback" role="status"></p>
    <div class="export-area" id="export-area" hidden>
      <label for="selection-text">הבחירה שלך להעתקה</label>
      <textarea id="selection-text" readonly aria-label="הבחירה שלך להעתקה"></textarea>
      <button type="button" id="copy-again">העתקת הבחירה</button>
    </div>
  </section>
  <noscript>כדי לסמן גוונים, פתחי את העמוד בדפדפן עם JavaScript פעיל.</noscript>

""],["sepia","ספיה","#7A5746",true,""],["clay","חמרה","#AA7B5A",true,""],["driftwood","עץ סחף","#8D7769",true,""],["sable","סייבל","#5A463D",true,""],["espresso2","אספרסו עמוק","#3F2B22",true,""]]},{"id":"gray","name":"אפורים ושחור","colors":[["fog","אפור ערפל","#D6D6D2",true,""],["silver","אפור כסף","#BFC1C3",true,""],["dove","אפור יונה","#AAA9A5",true,""],["stone","אפור אבן","#9A9A92",true,""],["pewter","אפור פיוטר","#7C8081",true,""],["graphite","גרפיט","#56575A",true,""],["charcoal","פחם","#3B3A3D",true,""],["black","שחור","#101216",true,""],["ash","אפר","#8E9093",true,""],["smoke","עשן","#76777B",true,""],["cement","מלט","#9A9B96",true,""],["pebble","חלוק","#B1A79C",true,""],["putty","מרק","#A99284",true,""],["mushroom","מושרוּם","#998675",true,""],["slate","צפחה כהה","#5D6670",true,""],["pepper","פלפל","#5C5A59",true,""],["raven","עורב","#2F3135",true,""],["licorice","ליקריץ","#1F2024",true,""],["taupe","טאופ","#9B8A7B",true,""],["greige","גרייז׳","#B7ADA0",true,""]]},{"id":"white","name":"לבנים ושמנת","colors":[["opticwhite","לבן נקי","#FFFFFF",true,"חסום בעליון"],["white","לבן רך","#F7F4EF",true,"חסום בעליון"],["milk","לבן חלב","#FAF7F0",true,"חסום בעליון"],["snow","שלג","#FCFCFA",true,"חסום בעליון"],["porcelain","פורצלן","#F8F5EF",true,"חסום בעליון"],["shell","צדף","#F5EEE8",true,"חסום בעליון"],["lace","תחרה","#FAF5EF",true,"חסום בעליון"],["frost","כפור","#F4F7F8",true,"חסום בעליון"],["moon","ירח","#EEE9E1",true,"חסום בעליון"],["pearl","פנינה","#ECE8DF",true,"חסום בעליון"],["ivory","שנהב","#EADBC7",true,""],["cream","קרם","#F2E4C8",true,"חסום בעליון"],["champagne","שמפניה","#E8D6B5",true,""],["linen","לבן פשתן","#F1E5D6",true,"חסום בעליון"],["oat","שיבולת","#DCCAAE",true,""],["sand","חול","#D9C2A2",true,""],["alabaster","אלבסטר","#F8F3EA",true,"חסום בעליון"],["bone","בון","#E8DFCF",true,"חסום בעליון"],["ecru","אקרו","#E8DCCB",true,""],["parchment","קלף","#EDE2D0",true,"חסום בעליון"],["gesso","גסו","#F7F1E7",true,"חסום בעליון"]]}]</script>
<script>
(() => {
  'use strict';
  const groups=JSON.parse(document.getElementById('palette-data').textContent);
  const colors=groups.flatMap(g=>g.colors), byId=new Map(colors.map(c=>[c[0],c]));
  const KEY='shimi-looks-palette-review-v1';
  let keep=new Set(colors.filter(c=>c[3]).map(c=>c[0]));
  let notes=Object.fromEntries(colors.filter(c=>c[4]).map(c=>[c[0],c[4]]));
  let active=groups[0].id;
  const count=document.getElementById('selection-count'),saveStatus=document.getElementById('save-status');
  const shadeList=document.getElementById('shades'),nav=document.getElementById('families');
  const heading=document.getElementById('family-heading'),previous=document.getElementById('previous-family'),next=document.getElementById('next-family');
  const exportArea=document.getElementById('export-area'),exportText=document.getElementById('selection-text'),copyFeedback=document.getElementById('copy-feedback');
  const names=new Map(),seen=new Map(),displayNames=new Map();
  colors.forEach(c=>names.set(c[1],(names.get(c[1])||0)+1));
  colors.forEach(c=>{const n=(seen.get(c[1])||0)+1;seen.set(c[1],n);displayNames.set(c[0],names.get(c[1])>1?`${c[1]} ${n===1?'א׳':'ב׳'}`:c[1]);});
  try{
    const saved=JSON.parse(localStorage.getItem(KEY)||'null');
    if(saved?.version===1&&Array.isArray(saved.keepIds)&&saved.keepIds.every(id=>byId.has(id))){
      keep=new Set(saved.keepIds);
      notes=Object.fromEntries(Object.entries(saved.notes||{}).filter(([id,note])=>byId.has(id)&&typeof note==='string'));
      if(groups.some(g=>g.id===saved.active))active=saved.active;
      saveStatus.textContent='הבחירות השמורות שלך נטענו.';
    }
  }catch{saveStatus.textContent='השמירה בדפדפן אינה זמינה. בסיום העתיקי את הבחירה.';}
  function updateCount(){count.textContent=`${keep.size} גוונים נשארים · ${colors.length-keep.size} להסרה`;}
  function persist(){
    try{localStorage.setItem(KEY,JSON.stringify({version:1,baseVersion:'3.2.0',keepIds:[...keep],notes,active}));saveStatus.textContent='הבחירה נשמרה בדפדפן הזה.';saveStatus.classList.remove('error');}
    catch{saveStatus.textContent='לא ניתן לשמור בדפדפן. העתיקי את הבחירה לפני סגירת העמוד.';saveStatus.classList.add('error');}
  }
  function payloadText(){
    return 'זו בחירת הגוונים המלאה שלי ל-Shimi Looks. עדכן את האפליקציה ופרסם ב-GitHub. השאר רק את keepIds והסר את removeIds מכל הפריטים. ההערות הן הגבלות לפי פריט; היעדר הערה פירושו שאין הגבלה. הבחירה מחליפה חסימות קודמות. שמור את הדירוגים ואת כללי ההרמוניה. אם הערה אינה ברורה, שאל עליה לפני השינוי התלוי בה.\n\n'+JSON.stringify({kind:'shimi-palette-selection',version:1,baseVersion:'3.2.0',total:colors.length,keepIds:colors.filter(c=>keep.has(c[0])).map(c=>c[0]),removeIds:colors.filter(c=>!keep.has(c[0])).map(c=>c[0]),notes:Object.fromEntries(Object.entries(notes).filter(([id,value])=>keep.has(id)&&value.trim()))});
  }
  function edited(){updateCount();persist();exportArea.hidden=true;copyFeedback.textContent='';}
  function render(){
    const group=groups.find(g=>g.id===active),index=groups.indexOf(group);
    heading.textContent=`${group.name} · ${group.colors.length} גוונים`;
    nav.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.family===active)));
    shadeList.replaceChildren();
    for(const [id,name,hex] of group.colors){
      const display=displayNames.get(id),row=document.createElement('div');row.className='shade';row.dataset.kept=String(keep.has(id));
      const label=document.createElement('label');label.className='shade-main';label.htmlFor=`keep-${id}`;
      const check=document.createElement('input');check.className='shade-check';check.type='checkbox';check.id=`keep-${id}`;check.checked=keep.has(id);check.setAttribute('aria-label',`להשאיר ${display}`);
      const swatch=document.createElement('span');swatch.className='swatch';swatch.style.backgroundColor=hex;swatch.setAttribute('aria-hidden','true');
      const title=document.createElement('span');title.className='shade-name';title.textContent=display;
      const state=document.createElement('span');state.className='choice-state';state.textContent=keep.has(id)?'✓ נשאר':'להסרה';
      label.append(check,swatch,title,state);row.append(label);
      const noteLabel=document.createElement('label');noteLabel.className='note-label';noteLabel.htmlFor=`note-${id}`;noteLabel.textContent='הערה או הגבלה לפי פריט';
      const note=document.createElement('input');note.className='note';note.type='text';note.id=`note-${id}`;note.maxLength=300;note.value=notes[id]||'';note.placeholder='למשל: רק בנעליים ובתיק';note.setAttribute('aria-label',`הערה עבור ${display}`);
      row.append(noteLabel,note);shadeList.append(row);
      check.addEventListener('change',()=>{check.checked?keep.add(id):keep.delete(id);row.dataset.kept=String(check.checked);state.textContent=check.checked?'✓ נשאר':'להסרה';edited();});
      note.addEventListener('input',()=>{note.value.trim()?notes[id]=note.value:delete notes[id];edited();});
    }
    previous.disabled=index===0;next.disabled=index===groups.length-1;updateCount();
  }
  function chooseFamily(id,scroll=false){active=id;render();persist();if(scroll)heading.scrollIntoView({block:'start'});}
  for(const group of groups){const button=document.createElement('button');button.type='button';button.dataset.family=group.id;button.textContent=group.name;button.addEventListener('click',()=>chooseFamily(group.id));nav.append(button);}
  previous.addEventListener('click',()=>{const index=groups.findIndex(g=>g.id===active);if(index>0)chooseFamily(groups[index-1].id,true);});
  next.addEventListener('click',()=>{const index=groups.findIndex(g=>g.id===active);if(index<groups.length-1)chooseFamily(groups[index+1].id,true);});
  async function copySelection(){
    if(!keep.size){copyFeedback.textContent='סמני לפחות גוון אחד להשארה.';return;}
    exportText.value=payloadText();exportArea.hidden=false;persist();
    try{await navigator.clipboard.writeText(exportText.value);copyFeedback.textContent='הבחירה הועתקה. חזרי לשיחה והדביקי אותה בהודעה.';}
    catch{exportText.focus();exportText.select();copyFeedback.textContent='לחצי לחיצה ארוכה בתיבה, בחרי ״העתקה״ והדביקי בשיחה.';}
  }
  document.getElementById('finish').addEventListener('click',copySelection);
  document.getElementById('copy-again').addEventListener('click',copySelection);
  render();
})();
</script>

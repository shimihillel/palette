<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- bg off-white -->
  <rect width="1024" height="1024" rx="230" fill="#FAFAF8"/>

  <!-- accent bar top — like issue bar -->
  <rect x="0" y="0" width="1024" height="180" rx="0" fill="#B85C38"/>
  <rect x="0" y="0" width="1024" height="180" rx="230" fill="#B85C38"/>

  <!-- PALETTE text — Bebas style bold -->
  <text x="512" y="560"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="200" font-weight="900"
    fill="#1A1410" text-anchor="middle"
    letter-spacing="8">PAL</text>
  <text x="512" y="740"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="200" font-weight="900"
    fill="#1A1410" text-anchor="middle"
    letter-spacing="8">ETTE</text>

  <!-- thin line under text -->
  <rect x="120" y="780" width="784" height="4" fill="#1A1410"/>

  <!-- issue text -->
  <text x="512" y="860"
    font-family="Arial, sans-serif"
    font-size="42" font-weight="400"
    fill="#AAAAAA" text-anchor="middle"
    letter-spacing="8">DAILY LOOK EDITION</text>

  <!-- 4 color dots top right in accent bar -->
  <circle cx="700" cy="90" r="22" fill="rgba(250,250,248,0.3)"/>
  <circle cx="760" cy="90" r="22" fill="rgba(250,250,248,0.5)"/>
  <circle cx="820" cy="90" r="22" fill="rgba(250,250,248,0.7)"/>
  <circle cx="880" cy="90" r="22" fill="rgba(250,250,248,0.9)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- bg off-white -->
  <rect width="1024" height="1024" rx="230" fill="#FAFAF8"/>

  <!-- dark top bar — like issue bar -->
  <rect x="0" y="0" width="1024" height="280" rx="0" fill="#1A1410"/>
  <rect x="0" y="0" width="1024" height="280" rx="230" fill="#1A1410"/>

  <!-- PALETTE in Bebas style -->
  <text x="512" y="210"
    font-family="'Arial Black','Impact',sans-serif"
    font-size="160" font-weight="900"
    fill="#FAFAF8" text-anchor="middle"
    letter-spacing="6">PALETTE</text>

  <!-- divider line -->
  <rect x="100" y="320" width="824" height="3" fill="#1A1410"/>

  <!-- 4 large color circles — the pieces -->
  <circle cx="200" cy="580" r="130" fill="#B85C38" stroke="#1A1410" stroke-width="8"/>
  <circle cx="420" cy="580" r="130" fill="#1C2B3A" stroke="#1A1410" stroke-width="8"/>
  <circle cx="640" cy="580" r="130" fill="#4A2040" stroke="#1A1410" stroke-width="8"/>
  <circle cx="860" cy="580" r="130" fill="#C8A030" stroke="#1A1410" stroke-width="8"/>

  <!-- shine on circles -->
  <circle cx="165" cy="530" r="28" fill="rgba(255,255,255,0.18)"/>
  <circle cx="385" cy="530" r="28" fill="rgba(255,255,255,0.12)"/>
  <circle cx="605" cy="530" r="28" fill="rgba(255,255,255,0.12)"/>
  <circle cx="825" cy="530" r="28" fill="rgba(255,255,255,0.15)"/>

  <!-- divider line bottom -->
  <rect x="100" y="750" width="824" height="2" fill="#1A1410" opacity="0.3"/>

  <!-- Daily Look Edition -->
  <text x="512" y="860"
    font-family="Arial,sans-serif"
    font-size="52" font-weight="400"
    fill="#AAAAAA" text-anchor="middle"
    letter-spacing="8">DAILY LOOK EDITION</text>
</svg>
